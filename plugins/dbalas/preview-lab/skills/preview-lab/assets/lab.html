<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="preview-lab-spec" content="4">
<title>Preview Lab</title>
<style>
/* BRAND:START default — set these to the project's tokens (keep the names), then change "default" to the project name */
:root{--bg:#f6f6f8;--fg:#141416;--surface:#fff;--muted:#5f5f69;--line:#dcdce3;--accent:#4f46e5;--on-accent:#fff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;
  --radius:10px;--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=dark]{--bg:#09090c;--fg:#f2f2f6;--surface:#1e1e26;--muted:#ababb7;--line:#454552;--accent:#8b93ff;--on-accent:#0c0c0f;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
/* BRAND:END */
:root{color-scheme:light;--h:2.25rem;--hs:1.9rem;--r:calc(var(--radius)*.7)}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--fg) 28%,transparent) transparent}[hidden]{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--fg) 24%,transparent);border:2px solid transparent;border-radius:99px;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--fg) 42%,transparent)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,textarea,input,select{font:inherit;color:inherit;margin:0}
/* one control system: buttons, selects and inputs share height, border, radius and vertical centering */
button,select,input[type=text],input[type=number]{height:var(--h);border:1px solid var(--line);border-radius:var(--r);padding:0 .8rem;font-size:.9rem;line-height:1;vertical-align:middle}
button{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:var(--surface);cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s,transform .1s}
button:hover{border-color:var(--muted)}button:active{transform:scale(.97)}button:disabled{opacity:.5;cursor:default}
select{appearance:none;cursor:pointer;background-color:var(--surface);padding-right:1.9rem;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 13px) 52%,calc(100% - 8.5px) 52%;background-size:4.5px 4.5px;background-repeat:no-repeat}
input[type=text],input[type=number],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
textarea{padding:.6rem .75rem;line-height:1.45;resize:vertical;display:block}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sm,.tools button,.tools select,.tools input{height:var(--hs);font-size:.82rem;padding:0 .65rem}.tools select{padding-right:1.7rem}
.pill{border-radius:99px}
.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}.primary:hover{filter:brightness(1.08);border-color:transparent}
.ghost{background:transparent;border-color:transparent;color:var(--muted)}.ghost:hover{color:var(--fg);border-color:var(--line)}
[aria-pressed=true].tog,.pill[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;font:600 11px/1 ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;color:var(--muted);vertical-align:middle}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.badge,.st{display:inline-flex;align-items:center;gap:.25rem;height:20px;padding:0 8px;border-radius:99px;line-height:1;white-space:nowrap;flex:none;vertical-align:middle}
.badge{font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);white-space:nowrap}
.dotted{width:7px;height:7px;border-radius:50%;background:var(--accent)}

header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:auto;padding:.7rem 1.25rem;display:flex;gap:1rem;align-items:center}
.brand{display:flex;gap:.7rem;align-items:center;min-width:0;flex:1}.brand>div{min-width:0}
.brand h1,.brand p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.logo.img{background:none;color:var(--accent)}.logo img,.logo svg{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:1.02rem;margin:0;line-height:1.3}.brand h1 .badge{margin-left:.4rem}.brand p{margin:0;color:var(--muted);font-size:.84rem}
.progress{display:flex;align-items:center;gap:.6rem;font-size:.84rem;color:var(--muted);white-space:nowrap}
.meter{width:110px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.filters{display:flex;gap:.35rem;flex-wrap:wrap}.filters small{opacity:.65}
.actions{display:flex;gap:.4rem;align-items:center;flex:none}

main{max-width:1400px;margin:auto;padding:1.25rem 1.25rem 2rem}
.lead{display:flex;flex-direction:column;gap:.9rem;margin-bottom:1.6rem}
.lead .row{display:flex;gap:.6rem 1rem;align-items:center;flex-wrap:wrap}
.lead .meta-r{font-size:.84rem;color:var(--muted)}
.rnotes{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.8rem .9rem}
.rnotes textarea{min-height:2.6rem;background:var(--bg)}.rnotes .label{margin-bottom:.45rem}
.ro-note{white-space:pre-wrap;font-size:.92rem}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:1.5rem 1rem 2.5rem}footer a{color:inherit;font-weight:600}footer a:hover{color:var(--accent)}
footer i{font-style:normal;color:var(--bad)}
section{margin:1.1rem 0 2.2rem}
section h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 .8rem;display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
section h2 small{font-weight:400;letter-spacing:0;text-transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px -14px rgb(0 0 0/.35);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[data-status=approved]{border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}.card[data-status=changes]{border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}
.card{box-shadow:0 1px 2px rgb(0 0 0/.06)}:root[data-theme=dark] .card{box-shadow:0 1px 3px rgb(0 0 0/.7)}
.thumb{position:relative;aspect-ratio:16/10;background:color-mix(in srgb,var(--fg) 6%,var(--surface));overflow:hidden;border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.thumb img.whole,.strip img.whole{object-fit:scale-down;object-position:center;padding:6%}
.thumb iframe{width:400%;height:400%;transform:scale(.25);transform-origin:0 0;border:0;pointer-events:none;background:#fff}
.st{font-size:.72rem;font-weight:600;border:1px solid var(--line)}
.st.c-approved{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.st.c-changes{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.c-approved{color:var(--ok)}.c-changes{color:var(--warn)}
.meta{padding:.7rem .85rem;display:flex;flex-direction:column;gap:.3rem;min-width:0}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:20px}.mrow b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.35rem .6rem;flex-wrap:wrap;min-height:22px}.sub>*{display:inline-flex;align-items:center;height:22px;line-height:1}.sub>:empty{display:none}
.rb{gap:.3rem;padding:0 8px;border-radius:99px;font-weight:700;font-size:.72rem;border:1px solid color-mix(in srgb,currentColor 35%,transparent)}.rb svg{width:12px;height:12px;flex:none}
.empty{text-align:center;color:var(--muted);padding:5rem 1rem}

#dlg{border:0;padding:0;width:100vw;height:100dvh;max-width:none;max-height:none;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:rgb(0 0 0/.55)}
.detail{display:grid;grid-template-columns:1fr 370px;height:100%}.detail:focus{outline:none}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:.3rem;flex:none;max-width:100%;flex-wrap:wrap}
.tools{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;margin-left:auto}.tools input{width:5.5rem}.tools a{color:var(--accent);font-size:.82rem;padding:0 .3rem}
.vw{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:grid;padding:1rem 3.5rem;overflow:auto}
.canvas{position:relative;line-height:0;margin:auto}.view.actual .canvas{margin:0 auto}
.canvas img{display:block;max-width:calc(100vw - 490px);max-height:calc(100dvh - 200px);border-radius:8px;box-shadow:0 8px 40px -12px rgb(0 0 0/.35);user-select:none}
.view.actual .canvas img{max-width:none;max-height:none}
.frame{position:relative;overflow:hidden;border-radius:8px;box-shadow:0 8px 40px -12px rgb(0 0 0/.35);background:#fff}
.frame iframe{border:0;transform-origin:0 0;display:block}
.overlay{position:absolute;inset:0;cursor:crosshair;touch-action:none}.live .overlay{pointer-events:none}
.live.annotate .overlay{pointer-events:auto;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.area{position:absolute;height:auto;padding:0;border:2px solid var(--accent);border-radius:4px;background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:0 0 0 1px rgb(255 255 255/.7)}
.area:hover{background:color-mix(in srgb,var(--accent) 24%,transparent);border-color:var(--accent)}
.area span{position:absolute;top:-11px;left:-11px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 11px/22px var(--font);text-align:center;box-shadow:0 1px 4px rgb(0 0 0/.35)}
.area.draft{pointer-events:none}
.area.rec{border:2px dashed var(--warn);background:color-mix(in srgb,var(--warn) 5%,transparent);box-shadow:none}.area.rec:hover,.area.rec.hot{background:color-mix(in srgb,var(--warn) 16%,transparent);border-style:solid;border-color:var(--warn)}
.area.rec span{background:var(--warn);color:var(--surface);width:auto;min-width:22px;padding:0 5px;border-radius:99px}
#close{position:fixed;top:.55rem;right:.8rem;z-index:6;width:36px;height:36px;padding:0;border-radius:50%;font-size:1rem;color:var(--fg);box-shadow:0 2px 8px rgb(0 0 0/.15)}
.pbody h3{padding-right:2.8rem}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;padding:0;font-size:1.2rem;z-index:2}.nav.prev{left:.6rem}.nav.next{right:.6rem}
.strip{display:flex;gap:.5rem;padding:.6rem 1rem;border-top:1px solid var(--line);overflow-x:auto;scroll-snap-type:x mandatory}
.strip button{white-space:normal;flex:0 0 auto;width:84px;height:54px;padding:0;overflow:hidden;scroll-snap-align:center;opacity:.55;position:relative;font-size:.72rem}
.strip button[aria-current=true]{opacity:1;outline:2px solid var(--accent);outline-offset:1px}
.strip img{width:100%;height:100%;object-fit:cover;object-position:top}
.dot{position:absolute;bottom:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--line);border:1px solid var(--surface)}
.panel{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.pbody{flex:1;overflow:auto;padding:1.1rem;display:flex;flex-direction:column;gap:1rem}
.pbody h3{margin:0;font-size:1.15rem;line-height:1.3}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}.chips>span:not(.badge){display:inline-flex;align-items:center;height:22px;border:1px solid var(--line);border-radius:99px;padding:0 8px;line-height:1}
.prev-box{border:1px dashed var(--line);border-radius:var(--r);padding:.6rem .75rem;font-size:.86rem;display:flex;flex-direction:column;gap:.2rem}
.prev-box b{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.verdict button{--c:var(--ok);height:auto;justify-content:flex-start;gap:.6rem;padding:.65rem .7rem;text-align:left;color:var(--fg);
  border-color:color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.verdict [data-s=changes]{--c:var(--warn)}
.verdict i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 15px/1 var(--font);color:var(--c);background:color-mix(in srgb,var(--c) 20%,transparent)}
.verdict span{display:flex;flex-direction:column;gap:3px;flex:1;line-height:1.15;font-weight:600}.verdict small{font-weight:400;font-size:.75rem;color:var(--muted)}
.verdict button:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.verdict [aria-pressed=true],.verdict [aria-pressed=true]:hover{background:var(--c);border-color:var(--c);color:var(--surface);box-shadow:0 6px 18px -8px var(--c)}
.verdict [aria-pressed=true] i{background:var(--surface);color:var(--c)}.verdict [aria-pressed=true] small,.verdict [aria-pressed=true] kbd{color:inherit;border-color:currentColor}
.label{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.35rem;display:flex;justify-content:space-between}
.areas{display:flex;flex-direction:column;gap:.4rem;margin:0;padding:0;list-style:none}
.areas li{display:flex;gap:.4rem;align-items:center}.areas .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 11px/22px var(--font);text-align:center}
.areas button{width:var(--h);padding:0}
.recs{display:flex;flex-direction:column;gap:.45rem}
.rec{display:flex;gap:.6rem;align-items:flex-start;font-size:.88rem;line-height:1.4;padding:.6rem .65rem;border:1px solid var(--line);border-left:3px solid var(--sev,var(--line));border-radius:var(--r);background:var(--bg);cursor:pointer;transition:border-color .15s,background .15s}
.rec:hover,.rec.hot{border-color:var(--sev,var(--muted))}.rec:has(input:checked){background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-color:var(--accent)}
.rec input{margin:.15rem 0 0;width:16px;height:16px;flex:none;accent-color:var(--accent)}.rec input:disabled+span{opacity:.85}
.rhead{display:flex;align-items:center;gap:.35rem;margin-bottom:.2rem;flex-wrap:wrap}.rtype{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rnum{font:700 .68rem/18px var(--font);height:18px;padding:0 6px;border-radius:99px;background:var(--warn);color:var(--surface);margin-left:auto}
.recbar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.45rem}.recbar .label{margin:0;display:block}
.flash{animation:flash 1.2s}@keyframes flash{0%,40%{box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 45%,transparent)}}
.sev{display:inline-flex;align-items:center;height:18px;font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:0 7px;border-radius:99px}
.sev-high{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}.sev-medium{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}.sev-low{background:var(--line);color:var(--muted)}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.75rem 1.1rem;border-top:1px solid var(--line)}
.modal{width:min(560px,calc(100vw - 2rem));border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem;background:var(--surface);color:var(--fg);box-shadow:0 20px 60px -20px rgb(0 0 0/.5)}
.modal h2{margin:0 0 .2rem;font-size:1.05rem}.modal textarea{margin:.8rem 0}.modal .row{display:flex;justify-content:flex-end}
.toast{position:fixed;bottom:1.25rem;left:50%;transform:translate(-50%,150%);opacity:0;background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:99px;font-size:.9rem;transition:transform .25s,opacity .25s;z-index:20}
.toast.show{transform:translate(-50%,0);opacity:1}
.done{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:var(--bg);z-index:30;padding:2rem}
.done i{font-size:3rem;font-style:normal;color:var(--accent)}.done h2{margin:.3rem 0}.done p{color:var(--muted)}
@media (max-width:860px){.detail{display:block;height:auto}.vw{flex:none;height:60dvh}.panel{border-left:0;border-top:1px solid var(--line)}
  .top,.pfoot{position:sticky;z-index:3}.top{top:0;background:var(--bg);padding-right:3.6rem}.pfoot{bottom:0;background:var(--surface)}
  .view{padding:.75rem 2.8rem}.canvas img{max-width:calc(100vw - 6rem);max-height:calc(60dvh - 1.5rem)}.meter,.nl{display:none}.bar,main{padding-left:1rem;padding-right:1rem}}
@media (max-width:600px){.bar{gap:.5rem}.progress,.brand p,#copy{display:none}.actions{gap:.15rem}.actions .ghost{padding:0 .55rem}.grid{grid-template-columns:1fr}
  .top{padding:.5rem 3.4rem .5rem .75rem;gap:.35rem}.top kbd{display:none}.verdict button{padding:.6rem .55rem}.verdict kbd{display:none}.pfoot .hint:nth-child(2){display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><div class="logo" id="logo" aria-hidden="true"></div><div><h1 id="title">Preview Lab</h1><p id="subtitle"></p></div></div>
  <div class="progress" aria-live="polite"><div class="meter"><i id="meter"></i></div><span id="count"></span></div>
  <div class="actions">
    <button class="ghost" id="theme"></button>
    <button class="ghost" id="copy"></button>
    <button class="primary" id="send"></button>
  </div>
</div></header>
<main id="main"></main>
<footer id="foot"></footer>

<dialog id="dlg">
  <button id="close">✕</button>
  <div class="detail" tabindex="-1" autofocus>
    <div class="stage">
      <div class="top"><div class="tabs" role="group" id="tabs"></div><div class="tools" id="tools"></div>
        <button class="ghost sm notesBtn"></button></div>
      <div class="vw"><button class="nav prev" id="prev">‹</button>
        <div class="view" id="view"><div class="canvas" id="canvas"></div></div>
        <button class="nav next" id="next">›</button></div>
      <div class="strip" id="strip"></div>
    </div>
    <aside class="panel"><div class="pbody" id="panel"></div>
      <div class="pfoot"><span class="hint" id="pos"></span><span class="hint"><kbd>←</kbd> <kbd>→</kbd> <kbd>A</kbd> <kbd>C</kbd> <kbd>Esc</kbd></span>
        <button class="primary" id="nextBtn"></button></div></aside>
  </div>
</dialog>
<dialog id="out" class="modal"><form method="dialog">
  <p class="hint" id="outHint"></p><textarea id="outText" rows="12" readonly aria-labelledby="outHint"></textarea>
  <div class="row"><button class="primary" id="outDone"></button></div>
</form></dialog>
<dialog id="notes" class="modal"><form method="dialog">
  <h2 id="notesTitle"></h2><p class="hint" id="notesHint"></p>
  <textarea id="general" class="gen" rows="6" aria-labelledby="notesTitle"></textarea>
  <div class="row"><button class="primary" id="notesDone"></button></div>
</form></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* BRAND:START — set with "pl.mjs brand": name, logo (inline <svg…> or image URL; empty = initial letter), lang,
   and copy, which overrides any key of STR below (translate or re-voice the lab there and nowhere else) */
const BRAND = {"name":"","logo":"","lang":"en","copy":{}};
/* BRAND:END */
const STR = {
  send: 'Send feedback', copy: 'Copy as prompt', sent: 'Sent. Your agent has it.', sentHint: 'Keep this tab open: the next round loads here.',
  empty: 'Nothing to review yet. Your agent will add items here.', loadError: 'Could not load the lab. Ask your agent to start it again.',
  reviewed: 'reviewed', filter: 'Filter', all: 'All', todo: 'To review', isNew: 'New', updated: 'Updated',
  approve: 'Approve', approveHint: 'Looks good', changes: 'Changes', changesHint: 'Needs work', approved: 'Approved',
  round: 'Round', complete: 'complete · beta', views: 'views', live: 'Live', recs: 'tips', rec1: 'tip', other: 'Other', items: 'Items', review: 'Review',
  notes: 'Notes', notesTitle: 'Notes for this round', notesHint: 'For everything at once: overall impressions, or other screens, states or sizes you want to see next.',

$('#main').addEventListener('change', e => { if (e.target.id === 'roundSel') { view = +e.target.value; filter = 'all'; render(M); scrollTo(0, 0); } });
$('#notes').addEventListener('close', refresh);
const restage = () => { const it = items[cur]; drawStage(it, views(it)[tab]); };
$('#tools').addEventListener('click', e => {
  const id = e.target.closest('button')?.id;
  if (id === 'fit' || id === 'actual') { fit = id === 'fit'; restage(); }
  else if (id === 'rot') { dev = { w: dev.h, h: dev.w }; restage(); }
  else if (id === 'annotate') { const on = e.target.getAttribute('aria-pressed') !== 'true'; e.target.setAttribute('aria-pressed', on); $('#canvas').classList.toggle('annotate', on); }
});
$('#tools').addEventListener('change', e => {
  const t = e.target, devs = M.devices || DEVICES;
  if (t.id === 'dev' && t.value !== 'custom') dev = { w: devs[t.value].w, h: devs[t.value].h };
  if (t.id === 'w') dev = { w: Math.max(200, Math.min(3840, +t.value || dev.w)), h: dev.h };
  if (t.id === 'zoom') zoom = +t.value;
  restage();
});
addEventListener('resize', () => $('#dlg').open && views(items[cur])[tab]?.kind === 'live' && !zoom && restage());
// Areas: drag on the overlay to draw a box (stored in % of the view); a plain click marks a small box around the point.
let drag = null;
const clamp = v => Math.min(1, Math.max(0, v)), r1 = v => Math.round(v * 10) / 10;
const rect = e => { const { r, x, y } = drag, x1 = clamp((x - r.left) / r.width), y1 = clamp((y - r.top) / r.height), x2 = clamp((e.clientX - r.left) / r.width), y2 = clamp((e.clientY - r.top) / r.height);
  return { x: Math.min(x1, x2) * 100, y: Math.min(y1, y2) * 100, w: Math.abs(x2 - x1) * 100, h: Math.abs(y2 - y1) * 100 }; };
$('#canvas').addEventListener('pointerdown', e => {
  if (ro || e.target.id !== 'overlay' || e.button) return;
  drag = { r: e.target.getBoundingClientRect(), x: e.clientX, y: e.clientY, el: document.createElement('div') };
  drag.el.className = 'area draft'; e.target.append(drag.el); e.target.setPointerCapture(e.pointerId); e.preventDefault();
});
$('#canvas').addEventListener('pointermove', e => { if (drag) drag.el.style.cssText = box(rect(e)); });
$('#canvas').addEventListener('pointerup', e => {
  if (!drag) return;
  let b = rect(e); const { r } = drag; drag.el.remove(); drag = null;
  if (b.w * r.width < 800 && b.h * r.height < 800) { // a click, not a drag: a 48px square around the point
    const w = 4800 / r.width, h = 4800 / r.height;
    b = { x: Math.min(100 - w, Math.max(0, b.x - w / 2)), y: Math.min(100 - h, Math.max(0, b.y - h / 2)), w, h };
  }
  const s = S(items[cur]); s.areas.push({ shot: viewLabel(), x: r1(b.x), y: r1(b.y), w: r1(b.w), h: r1(b.h), note: '' });
  setStatus('changes', true); save(); refresh(); drawAreas(); listAreas(); $('#areas').lastElementChild.querySelector('input').focus();
});
$('#canvas').addEventListener('click', e => {
  const a = e.target.closest('.area[data-a]'); if (a) return $(`#areas input[data-a="${a.dataset.a}"]`)?.focus();
  const r = e.target.closest('.area.rec'); if (!r) return;
  const card = $(`.rec[data-rk="${r.dataset.rk}"]`); card.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
});
// Hovering a recommendation lights up its marker, and the other way round. Its marker may be on another view: switch to it.
const hot = (k, on) => $$(`[data-rk="${k}"]`).forEach(x => x.classList.toggle('hot', on));
for (const el of ['#panel', '#canvas']) {
  $(el).addEventListener('pointerover', e => { const x = e.target.closest('[data-rk]'); if (x) hot(x.dataset.rk, true); });
  $(el).addEventListener('pointerout', e => { const x = e.target.closest('[data-rk]'); if (x) hot(x.dataset.rk, false); });
}
// Touch: swipe sideways on the empty stage (not on the image, where it draws) to move between items.
let swipe = null;
$('#view').addEventListener('pointerdown', e => { swipe = e.pointerType === 'touch' && e.target.id !== 'overlay' ? { x: e.clientX, y: e.clientY } : null; });
$('#view').addEventListener('pointerup', e => {
  if (!swipe || !fit) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 50) show(cur + (dx < 0 ? 1 : -1));
});
$('#panel').addEventListener('click', e => {
  const b = e.target.closest('.verdict button'); if (b) return setStatus(b.dataset.s);
  if (e.target.closest('.rnum')) { e.preventDefault(); const it = items[cur], r = bySev(it.recommendations)[+e.target.closest('.rec').dataset.rk], k = views(it).findIndex(v => v.label === (r.shot || views(it)[0].label)); if (k >= 0 && k !== tab) { tab = k; show(cur, true); } return; }
  if (e.target.id === 'recAll') { const s = S(items[cur]), all = items[cur].recommendations.map(r => r.id); s.accepted = s.accepted.length === all.length ? [] : all; if (s.accepted.length) setStatus('changes', true); save(); refresh(); return show(cur, true); }
  const d = e.target.closest('[data-del]'); if (d) { S(items[cur]).areas.splice(+d.dataset.del, 1); save(); refresh(); drawAreas(); listAreas(); }
});
$('#panel').addEventListener('input', e => {
  const s = S(items[cur]), t = e.target;
  if (t.id === 'comment') { s.comment = t.value; if (t.value) setStatus('changes', true); }
  else if (t.dataset.a) s.areas[+t.dataset.a].note = t.value;
  else if (t.dataset.r) { s.accepted = $$('.recs input:checked').map(x => x.dataset.r); if (s.accepted.length) setStatus('changes', true); recCount(); }
  save(); refresh();
});
document.addEventListener('keydown', e => {
  if (!$('#dlg').open || $('.modal[open]') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { if (e.key === 'Escape') { document.activeElement.blur(); e.preventDefault(); } return; }
  const k = e.key.toLowerCase();
  if (k === 'arrowright') show(cur + 1); else if (k === 'arrowleft') show(cur - 1);
  else if (k >= '1' && k <= '9') { if (+k <= views(items[cur]).length) { tab = +k - 1; show(cur, true); } } // 1-9: switch view
  else { const hit = Object.keys(ST).find(s => ST[s].key === k); if (hit) setStatus(hit); }
});

/* output: the markdown is for the agent, so it stays in English whatever the lab language */
function payload() {
  return { project: M.project, mode: M.mode || 'visual', round: view, submittedAt: new Date().toISOString(), general: st.general || '',
    items: items.map(i => { const { status, comment, areas, accepted } = S(i); return { id: i.id, title: i.title, status, comment, areas, accepted }; }) };
}
function markdown(fb) {
  const by = s => fb.items.filter(i => i.status === s);
  const L = [`# Preview Lab feedback: ${fb.project || ''} · round ${fb.round} (${fb.mode})`,
    `${by('approved').length} approved · ${by('changes').length} changes · ${by('').length} unreviewed`];
  if (fb.general.trim()) L.push(`**General:** ${fb.general.trim()}`);
  if (by('approved').length) L.push(`**Approved:** ${by('approved').map(i => i.title).join(', ')}`);
  for (const i of fb.items) {
    const it = items.find(x => x.id === i.id), declined = i.status === 'changes' ? (it?.recommendations || []).filter(r => !i.accepted.includes(r.id)).map(r => r.id) : [];
    if (!(i.status === 'changes' || i.comment.trim() || i.areas.length || i.accepted.length || declined.length)) continue;
    L.push('', `## ${i.title} [${i.id}] — ${i.status || 'comment'}`);
    if (i.comment.trim()) L.push(i.comment.trim());
    i.areas.forEach((a, n) => L.push(`- Area ${n + 1} (${a.shot} @ x ${a.x}%, y ${a.y}%, ${a.w}×${a.h}%): ${a.note || '(no note)'}`));
    i.accepted.forEach(id => { const r = it?.recommendations?.find(x => x.id === id); L.push(`- Apply rec ${id}${r ? ` [${r.type}/${r.severity}]: ${r.text}` : ''}`); });
    if (declined.length) L.push(`- Declined recs: ${declined.join(', ')}`);
  }
  return L.join('\n') + '\n';
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); }
// No clipboard access (blocked, or an insecure page): show the text to copy by hand.
async function copy(msg = T.copied) {
  const md = markdown(payload());
  try { await navigator.clipboard.writeText(md); toast(msg); } catch { $('#outText').value = md; $('#out').showModal(); $('#outText').select(); }
}
$('#copy').onclick = () => copy();
$('#send').onclick = async () => {
  const fb = payload(), todo = fb.items.filter(i => !i.status).length;
  if (todo && !confirm(T.confirmSend.replace('{n}', todo))) return;
  if (DATA) return copy();
  $('#send').disabled = true;
  try {
    const r = await fetch('feedback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...fb, markdown: markdown(fb) }) });
    if (!r.ok) throw 0;
  } catch { $('#send').disabled = false; return copy(T.offline); }
  ls.set(KEY, null);
  $('#dlg').close();
  document.body.insertAdjacentHTML('beforeend', `<div class="done" role="alert"><div><i>✓</i><h2>${esc(T.sent)}</h2><p>${esc(T.sentHint)}</p></div></div>`);
  // The server stops after a send. When the agent serves the next round, this same tab picks it up.
  history.replaceState(null, '', location.pathname);
  setInterval(async () => { try { if ((await fetch('manifest.json', { cache: 'no-store' })).ok) location.reload(); } catch {} }, 2000);
};
</script>
