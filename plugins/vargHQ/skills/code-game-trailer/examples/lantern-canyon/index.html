<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Canyon</title>
<link rel="icon" href="data:,">
<!-- Lantern Canyon: steer a paper-lantern glider through a dusk canyon and collect sparks.
     One HTML file, three.js from jsDelivr (pinned), every model, texture and light made in code.
     Play: open over http (bunx serve, python3 -m http.server). Arrows / WASD steer, Space boosts.
     URL flags: ?autopilot=1 (attract mode), ?distance=900 (start further down the canyon).
     Trailer hooks: window.__game (see the bottom of the script). -->
<style>
  :root { --ember: #ff5315; --ink: #f3ece2; --teal: #5fd6cf; }
  html, body { margin: 0; height: 100%; background: #030507; overflow: hidden; }
  canvas#gl { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: var(--ink);
    font-family: "Avenir Next", "Futura", "Helvetica Neue", Arial, sans-serif; text-shadow: 0 0 1.4vh rgba(0,0,0,.55); }
  .tl { position: absolute; left: 6.5vh; top: 4.4vh; }
  .tr { position: absolute; right: 6.5vh; top: 4.4vh; text-align: right; }
  .label { font-size: 1.25vh; letter-spacing: .42em; font-weight: 600; opacity: .6; }
  .score { font-size: 5.6vh; font-weight: 600; letter-spacing: .05em; line-height: 1; margin-top: .7vh;
    font-variant-numeric: tabular-nums; transform-origin: left center; }
  .combo { font-size: 2.1vh; color: var(--ember); font-weight: 700; margin-top: 1vh; letter-spacing: .16em; min-height: 2.6vh; }
  .dist { font-size: 3.3vh; font-weight: 500; letter-spacing: .08em; margin-top: .7vh; font-variant-numeric: tabular-nums; }
  .bottom { position: absolute; left: 50%; bottom: 4.6vh; transform: translateX(-50%); width: 30vh; text-align: center; }
  .flame { height: .6vh; background: rgba(255,255,255,.13); border-radius: 1vh; overflow: hidden; margin-top: 1vh; }
  .flame i { display: block; height: 100%; width: 50%; background: linear-gradient(90deg, #ff9a4d, var(--ember));
    box-shadow: 0 0 1.4vh var(--ember); }
  .pop { animation: pop .32s ease-out; }
  @keyframes pop { 0% { transform: scale(1.16); color: #ffd7b3; } 100% { transform: scale(1); } }
  #toast { position: absolute; left: 0; right: 0; top: 27vh; text-align: center; font-size: 2.6vh; font-weight: 600;
    letter-spacing: .5em; color: var(--ink); opacity: 0; }
  #toast b { color: var(--ember); font-weight: 700; }
  #toast.show { animation: toast 1.6s ease-out forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(1.5vh); } 12% { opacity: 1; transform: none; }
    75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-1vh); } }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ink); font-family: "Avenir Next", "Futura", "Helvetica Neue", Arial, sans-serif; background: rgba(2,4,6,.35); }
  #start h1 { font-size: 7vh; font-weight: 600; letter-spacing: .32em; margin: 0 0 2vh .32em; }
  #start p { font-size: 1.7vh; letter-spacing: .4em; opacity: .7; margin: 0; }
  #start.hidden, #hud.hidden { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="tl"><div class="label">SPARKS</div><div class="score" id="score">0000</div><div class="combo" id="combo"></div></div>
  <div class="tr"><div class="label">DISTANCE</div><div class="dist" id="dist">0.00 KM</div></div>
  <div class="bottom"><div class="label">FLAME</div><div class="flame"><i id="flame"></i></div></div>
  <div id="toast"></div>
</div>
<div id="start"><h1>LANTERN CANYON</h1><p>ARROWS TO STEER &nbsp;·&nbsp; SPACE TO BOOST &nbsp;·&nbsp; PRESS ANY KEY</p></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search);
const V3 = THREE.Vector3, UP = new V3(0, 1, 0);
const EMBER = new THREE.Color('#ff5315');

// ---------- deterministic helpers (world generation never uses Math.random) ----------
function mulberry(a) { return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = mulberry(20261109);
const rr = (a, b) => a + (b - a) * rand();
function h3(x, y, z) { let n = Math.imul(x, 0x27d4eb2d) ^ Math.imul(y, 0x165667b1) ^ Math.imul(z, 0x1b873593);
  n = Math.imul(n ^ (n >>> 15), 0x85ebca6b); n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16; return (n >>> 0) / 4294967296; }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const fx = x - xi, fy = y - yi, fz = z - zi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  const L = (a, b, t) => a + (b - a) * t;
  const c = (i, j, k) => h3(xi + i, yi + j, zi + k);
  return L(L(L(c(0,0,0), c(1,0,0), u), L(c(0,1,0), c(1,1,0), u), v), L(L(c(0,0,1), c(1,0,1), u), L(c(0,1,1), c(1,1,1), u), v), w);
}
function fbm(x, y, z, o = 4) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * (vnoise(x * f, y * f, z * f) * 2 - 1); f *= 2.03; a *= .5; } return s; }
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------- the canyon path: x(s), y(s), z = -s ----------
const PX = s => 36 * Math.sin(s / 190) + 15 * Math.sin(s / 71 + 1.3);
const PY = s => 4 * Math.sin(s / 130 + 0.7);
const DPX = s => 36 / 190 * Math.cos(s / 190) + 15 / 71 * Math.cos(s / 71 + 1.3);
const DPY = s => 4 / 130 * Math.cos(s / 130 + 0.7);
const HW = s => 20 + 5 * Math.sin(s / 97) + 3 * Math.sin(s / 41 + 2);   // half width at cruise height
const FLOOR = -10, S_MIN = -260, S_MAX = 3400;
function frameAt(s, o = {}) {
  o.c = (o.c || new V3()).set(PX(s), 0, -s);
  o.T = (o.T || new V3()).set(DPX(s), DPY(s), -1).normalize();
  o.R = (o.R || new V3()).crossVectors(o.T, UP).normalize();
  return o;
}

// ---------- renderer, scene, post ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const FOG = new THREE.Color('#0b1a1d');
scene.fog = new THREE.Fog(FOG, 30, 520);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 4000);
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.62, 0.5, 0.86);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- lights: teal fill, low warm dusk key, the lantern ----------
scene.add(new THREE.HemisphereLight('#3fb3ad', '#0a0c0c', 1.25));
const moon = new THREE.DirectionalLight('#5cc8c2', 0.45); moon.position.set(90, 160, 220); scene.add(moon);
const dusk = new THREE.DirectionalLight('#ff7a45', 1.6); dusk.position.set(-120, 70, -600); scene.add(dusk, dusk.target);
const lanternLight = new THREE.PointLight(EMBER, 260, 55, 2); scene.add(lanternLight);
const gateLight = new THREE.PointLight('#ff7a3a', 520, 90, 2); scene.add(gateLight);

// ---------- sky dome: near-black zenith, teal haze at the horizon, ember dusk glow down the canyon ----------
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { fogc: { value: FOG }, ember: { value: EMBER }, time: { value: 0 } },
  vertexShader: `varying vec3 vd; void main(){ vd = normalize(position); vec4 p = modelViewMatrix * vec4(position,1.); gl_Position = projectionMatrix * p; gl_Position.z = gl_Position.w; }`,
  fragmentShader: `varying vec3 vd; uniform vec3 fogc, ember; uniform float time;
    float hash(vec3 p){ p = fract(p*0.3183099+.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    void main(){ float y = vd.y; vec3 zen = vec3(.004,.006,.012); vec3 col = mix(fogc, zen, smoothstep(-.02,.42,y));
      vec3 dir = normalize(vec3(-.15,.0,-1.)); float d = max(dot(normalize(vec3(vd.x,0.,vd.z)), dir), 0.);
      float glow = pow(d, 22.) * exp(-max(y,0.)*11.); col += ember * glow * .75 + vec3(1.,.55,.3) * pow(d,90.) * exp(-max(y,0.)*40.) * .7 + ember * pow(d, 4.) * exp(-max(y,0.)*25.) * .08;
      vec3 g = floor(vd*900.); float st = step(.9985, hash(g)) * smoothstep(.05,.5,y); col += vec3(.75,.9,1.) * st * (.6+.4*sin(time*2.+hash(g+3.)*40.));
      gl_FragColor = vec4(col,1.); }`,
}));
sky.renderOrder = -1; scene.add(sky);

// ---------- canyon walls + plateau (vertex-coloured strata, flat-shaded) ----------
const STRATA = ['#7a6a60', '#927563', '#5a524c', '#a3806a', '#6d6560', '#876752'].map(c => new THREE.Color(c));
const WET = new THREE.Color('#1b2b2b'), TOP = new THREE.Color('#4a403b');
const HEIGHTS = [-14, -8, -4, -1, 2, 5, 8, 11, 14, 18, 22, 27, 32, 38, 44, 51, 58, 64];
const OUT = [5, 14, 30, 60, 110, 200, 380, 700, 1200];
const rockMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .92, metalness: 0, flatShading: true, side: THREE.DoubleSide });
function wallLat(s, h, side) {
  return HW(s) + .2 * Math.max(h, 0) + .0045 * h * h - 3.2 * Math.exp(-(((h - 3) / 5) ** 2))
    + 6 * fbm(s * .035, h * .06, side * 7) + 1.8 * fbm(s * .14, h * .22, side * 7 + 3) + 1.0 * Math.sin(h * .9 + fbm(s * .02, 0, side) * 3);
}
function buildWalls(s0, s1, ds) {
  const rows = Math.round((s1 - s0) / ds) + 1, cols = HEIGHTS.length + OUT.length;
  const pos = [], col = [], idx = [], f = {}, c = new THREE.Color();
  for (const side of [-1, 1]) {
    const base = pos.length / 3;
    for (let i = 0; i < rows; i++) {
      const s = s0 + i * ds; frameAt(s, f);
      const topH = 58 + 8 * fbm(s * .02, 5, side * 3), hAt = j => -14 + (HEIGHTS[j] + 14) / 78 * (topH + 14), topLat = Math.max(...HEIGHTS.map((_, j) => wallLat(s, hAt(j), side)));
      for (let j = 0; j < cols; j++) {
        let lat, h;
        if (j < HEIGHTS.length) { h = hAt(j); lat = j === HEIGHTS.length - 1 ? topLat : wallLat(s, h, side); }
        else { const k = j - HEIGHTS.length; lat = topLat + OUT[k]; h = topH + 4 * Math.abs(fbm(s * .01, k, side * 9)) * smooth(0, 2, k) + k * 2 + Math.max(0, 70 * fbm(s * .004, k * .3, side * 5)) * smooth(3, 8, k); }
        const p = f.c.clone().addScaledVector(f.R, side * lat); p.y = h;
        pos.push(p.x, p.y, p.z);
        if (j >= HEIGHTS.length - 1) c.copy(TOP);
        else { const band = Math.floor((h + 6 * fbm(s * .012, h * .04, 2) + 40) / 5.5) % STRATA.length; c.copy(STRATA[band]); }
        c.multiplyScalar(j < HEIGHTS.length ? .75 + .5 * vnoise(s * .3, h * .3, side) : .8 + .3 * vnoise(s * .03, j, side));
        if (h < FLOOR + 3) c.lerp(WET, .7);
        col.push(c.r, c.g, c.b);
      }
    }
    for (let i = 0; i < rows - 1; i++) for (let j = 0; j < cols - 1; j++) {
      const a = base + i * cols + j, b = a + 1, d = a + cols, e = d + 1;
      if (side < 0) idx.push(a, d, b, b, d, e); else idx.push(a, b, d, b, e, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, rockMat);
}
for (let s = S_MIN; s < S_MAX; s += 200) scene.add(buildWalls(s, s + 200, 2.4));

// water: dark, glossy, catches the lantern's light
// water: reflects the dusk sky (same gradient as the dome) with code-made ripples, plus a pool of lantern light
const waterMat = new THREE.ShaderMaterial({ side: THREE.DoubleSide,
  uniforms: { fogc: { value: FOG }, ember: { value: EMBER }, time: { value: 0 }, lamp: { value: new V3() }, fnear: { value: 30 }, ffar: { value: 520 } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 fogc, ember, lamp; uniform float time, fnear, ffar; varying vec3 vW;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
    void main(){ vec3 V = normalize(vW - cameraPosition); vec2 q = vW.xz * .12;
      vec3 N = normalize(vec3((n(q + time * .25) - .5) * .16 + (n(q * 3.1 - time * .4) - .5) * .06, 1., (n(q * 1.7 - time * .2) - .5) * .16));
      vec3 R = reflect(V, N); float y = max(R.y, 0.);
      vec3 sky = mix(fogc, vec3(.004, .006, .012), smoothstep(-.02, .42, y));
      float d = max(dot(normalize(vec3(R.x, 0., R.z)), normalize(vec3(-.15, 0., -1.))), 0.);
      sky += ember * pow(d, 22.) * exp(-y * 11.) * .9 + vec3(1., .55, .3) * pow(d, 90.) * exp(-y * 40.) * 1.2 + ember * pow(d, 4.) * exp(-y * 25.) * .1;
      float fres = .04 + .96 * pow(1. - max(dot(-V, N), 0.), 5.);
      vec3 col = vec3(.004, .011, .013) + sky * (.35 + .65 * fres);
      float ld = distance(vW.xz, lamp.xz); col += ember * 1.6 * exp(-ld * ld / 30.) * smoothstep(26., 4., lamp.y - vW.y) * (.75 + .25 * n(q * 6. + time));
      col = mix(col, fogc, smoothstep(fnear, ffar, distance(vW, cameraPosition)));
      gl_FragColor = vec4(col, 1.); }` });
function buildWater(s0, s1, ds) {
  const rows = Math.round((s1 - s0) / ds) + 1, pos = [], idx = [], f = {};
  for (let i = 0; i < rows; i++) { const s = s0 + i * ds; frameAt(s, f);
    for (const lat of [-60, 60]) { const p = f.c.clone().addScaledVector(f.R, lat); pos.push(p.x, FLOOR, p.z); } }
  for (let i = 0; i < rows - 1; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, waterMat);
}
for (let s = S_MIN; s < S_MAX; s += 400) scene.add(buildWater(s, s + 400, 6));

// distant mesas: silhouettes that sink into the haze
const mesaMat = new THREE.MeshStandardMaterial({ color: '#120f0e', roughness: 1, flatShading: true });
for (let i = 0; i < 0; i++) {
  const g = new THREE.CylinderGeometry(rr(40, 90), rr(90, 180), rr(60, 140), 7, 3);
  const p = g.attributes.position; for (let k = 0; k < p.count; k++) p.setXYZ(k, p.getX(k) * (1 + .25 * (h3(k, i, 1) - .5)), p.getY(k), p.getZ(k) * (1 + .25 * (h3(k, i, 2) - .5)));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mesaMat), s = rr(300, 3400), side = rand() < .5 ? -1 : 1;
  const f = frameAt(s); m.position.copy(f.c).addScaledVector(f.R, side * rr(320, 700)); m.position.y = 30; scene.add(m);
}

// ---------- soft glow texture (drawn in code) ----------
function glowTex(stops) { const cv = document.createElement('canvas'); cv.width = cv.height = 128; const x = cv.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); for (const [o, c] of stops) g.addColorStop(o, c); x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t; }
const GLOW = glowTex([[0, 'rgba(255,255,255,1)'], [.18, 'rgba(255,200,150,.55)'], [.5, 'rgba(255,110,40,.14)'], [1, 'rgba(255,80,20,0)']]);
const MIST = glowTex([[0, 'rgba(160,220,215,.5)'], [.6, 'rgba(90,160,160,.12)'], [1, 'rgba(60,120,120,0)']]);

// mist on the water
for (let s = S_MIN; s < S_MAX; s += 18) {
  const f = frameAt(s), sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: MIST, color: '#3a7f7c', transparent: true, opacity: .12, depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
  sp.position.copy(f.c).addScaledVector(f.R, rr(-14, 14)); sp.position.y = FLOOR + rr(2, 6); sp.scale.set(rr(30, 55), rr(9, 15), 1); scene.add(sp);
  sp.onBeforeRender = (r, sc, cam) => { sp.material.opacity = .12 * smooth(10, 40, cam.position.distanceTo(sp.position)); };
}

// ---------- point clouds (sparks, embers, sky lanterns, stars) share one shader ----------
function pointsMat(size, opts = {}) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: { time: { value: 0 }, size: { value: size }, scale: { value: innerHeight / 2 }, gain: { value: opts.gain ?? 1 } },
    vertexShader: `attribute float alpha; attribute vec3 color; attribute float phase; varying float va; varying vec3 vc; uniform float time, size, scale;
      void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); gl_Position = projectionMatrix * mv;
        float tw = .75 + .25 * sin(time * 6. + phase * 30.); gl_PointSize = clamp(size * scale / -mv.z * tw, 0., 220.);
        float fogf = smoothstep(560., 60., -mv.z) * smoothstep(1.5, 7., -mv.z); va = alpha * fogf; vc = color; }`,
    fragmentShader: `varying float va; varying vec3 vc; uniform float gain; void main(){ vec2 d = gl_PointCoord - .5; float r = length(d) * 2.;
      float core = exp(-r * r * 9.), halo = exp(-r * 3.4) * .45; float a = (core + halo) * va * (1. - smoothstep(.85, 1., r));
      gl_FragColor = vec4(vc * a * gain + vec3(1.) * core * va * .55 * gain, 1.); }`,
  });
}
function cloud(n, size, gain) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('alpha', new THREE.BufferAttribute(new Float32Array(n), 1));
  g.setAttribute('phase', new THREE.BufferAttribute(Float32Array.from({ length: n }, () => rand()), 1));
  const p = new THREE.Points(g, pointsMat(size, { gain })); p.frustumCulled = false; scene.add(p); return p;
}

// sky lanterns rising above the plateau
const SKY_N = 320, skyL = cloud(SKY_N, 5.0, 2.6), skyBase = [];
for (let i = 0; i < SKY_N; i++) { const s = i % 5 < 2 ? rr(-60, 700) : rr(-200, 3400), f = frameAt(s), side = rand() < .5 ? -1 : 1;
  const inside = i % 3 === 0, p = f.c.clone().addScaledVector(f.R, side * (inside ? rr(0, 18) : rr(30, 220))); skyBase.push([p.x, inside ? rr(-20, 110) : rr(0, 170), p.z, rr(.8, 2.2)]);
  const c = new THREE.Color().setHSL(rr(.03, .07), 1, rr(.45, .6)); skyL.geometry.attributes.color.setXYZ(i, c.r, c.g, c.b); skyL.geometry.attributes.alpha.setX(i, rr(.5, 1)); }

// sparks to collect
const sparks = [];
function addSpark(s, lat, h) { const lim = HW(s) - 5.5; sparks.push({ s, lat: Math.max(-lim, Math.min(lim, lat)), h: Math.max(-4, Math.min(15, h)), alive: true }); }
const GATES = [520, 1240, 1960, 2680].map(s => ({ s, lat: 0, h: 4, r: 7.5, passed: false }));
// the level layout has its own random stream: cosmetic changes elsewhere must not move a single spark
const lrand = mulberry(424242), lrr = (a, b) => a + (b - a) * lrand();
const PILLARS = [];
for (let s = 640; s < 3300; s += lrr(60, 95)) {
  if (GATES.some(g => Math.abs(g.s - s) < 60) || HW(s) < 19) continue;
  const side = lrand() < .5 ? -1 : 1; PILLARS.push({ s, lat: side * lrr(4, 9), r: lrr(2.4, 3.6), top: lrr(26, 52) });
}

renderer.setAnimationLoop(t => { const dt = last === null ? 1 / 60 : Math.min(.05, (t - last) / 1000); last = t; frame(dt); if (!window.__game.ready) window.__game.ready = true; });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  for (const m of [sparkCloud, pool, storm, skyL]) m.material.uniforms.scale.value = innerHeight / 2; });
if (Q.has('autopilot') || Q.has('play')) start(); else update(0), snapCamera();

// ---------- trailer hooks (read by code-game-trailer/scripts/capture.ts) ----------
// ready: true after the first frame. camera: the camera the game renders with (a trailer camera path
// overrides it per render call). anchor: the player's canyon frame without roll (+x right, +y up, -z forward).
// place(s): a fixed Object3D at canyon distance s (centre line, y = 0) for world-fixed cameras.
// setup(opts): reset to a known state { distance, autopilot, score, heat, speedBonus, flame, lat, h, hud }.
// events: sound-worthy moments { t (s, page clock), type }, drained by the recorder.
const places = new Map();
window.__game = { ready: false, renderer, scene, camera, composer, player: lantern, anchor, setup, state: G,
  get events() { const e = G.events; G.events = []; return e; },
  boost(on = true) { on ? keys.add('Space') : keys.delete('Space'); },
  place(s) { if (!places.has(s)) { const o = new THREE.Object3D(), fr = frameAt(s); o.position.copy(fr.c);
      m4.makeBasis(fr.R, new V3().crossVectors(fr.R, fr.T), fr.T.clone().negate()); o.quaternion.setFromRotationMatrix(m4); scene.add(o); o.updateMatrixWorld(true); places.set(s, o); } return places.get(s); },
  layout: { sparks: sparks.map(({ s, lat, h }) => ({ s, lat, h })), gates: GATES.map(({ s, lat, h, r }) => ({ s, lat, h, r })), pillars: PILLARS } };
</script>
