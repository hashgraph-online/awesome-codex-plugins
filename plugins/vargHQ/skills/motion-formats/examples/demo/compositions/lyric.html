<!doctype html>
<!--
  kinetic-lyric-video · word-punch (assets/presets/kinetic-lyric-video.json)
  Invented lyric "say it soft, then say it loud" at 100 BPM (0.6 s = 18 f per beat), one word per
  beat, onsets at 0.3 + n*0.6 s (illustrative timings, no audio). Anton caps, tracking -3%,
  normal cap height 26% of the frame (16:9 range 22-32%), whisper 0.5x, hook 1.8x. Entry: 160 px
  slide in 5 f expo.out, alternating sides, starting 2 f before the onset; exit 4 f power3.in
  starting on the next onset (ink fades in 2 f). Colours #0A0A0A / #F5F5F0, accent #FF3D2E as a 1-frame-late
  duplicate behind the hook word. The hook lands on the chorus downbeat with an inverted frame,
  a 2-frame chromatic kick (6 px) and holds 1.5 s. Grain at 5%.
-->
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); font-weight: 400; font-display: block; }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0a0a0a;
        }
        #ly-bg {
          position: absolute;
          inset: 0;
          background: #0a0a0a;
        }
        .ly-w {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          display: flex;
          align-items: center;
          justify-content: center;
          opacity: 0;
        }
        .ly-w span {
          display: block;
          font-family: "Anton";
          font-weight: 400;
          letter-spacing: -0.03em;
          line-height: 1;
          color: #f5f5f0;
          white-space: nowrap;
        }
        #ly-accent span {
          color: #ff3d2e;
        }
        .ly-kick span {
          mix-blend-mode: multiply;
        }
        #ly-kick-r span { color: #ff3d2e; }
        #ly-kick-c span { color: #00b7c7; }
        #ly-grain {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          opacity: 0.05;
          mix-blend-mode: overlay;
        }
        #ly-label {
          position: absolute;
          left: 96px;
          bottom: 72px;
          font-family: "JetBrains Mono", monospace;
          font-size: 17px;
          color: #f5f5f0;
          opacity: 0.6;
        }
      </style>
      <div id="root" data-composition-id="lyric" data-width="1920" data-height="1080">
        <div id="ly-bg"></div>
        <div class="ly-w" id="ly-w0" data-scale="1"><span>SAY</span></div>
        <div class="ly-w" id="ly-w1" data-scale="1"><span>IT</span></div>
        <div class="ly-w" id="ly-w2" data-scale="0.5"><span>SOFT,</span></div>
        <div class="ly-w" id="ly-w3" data-scale="1"><span>THEN</span></div>
        <div class="ly-w" id="ly-w4" data-scale="1"><span>SAY</span></div>
        <div class="ly-w" id="ly-w5" data-scale="1"><span>IT</span></div>
        <div class="ly-w ly-kick" id="ly-kick-c" data-scale="1.8" data-layout-allow-overlap><span>LOUD</span></div>
        <div class="ly-w ly-kick" id="ly-kick-r" data-scale="1.8" data-layout-allow-overlap><span>LOUD</span></div>
        <div class="ly-w" id="ly-accent" data-scale="1.8" data-layout-allow-overlap><span>LOUD</span></div>
        <div class="ly-w" id="ly-w6" data-scale="1.8"><span>LOUD</span></div>
        <canvas id="ly-grain" width="960" height="540"></canvas>
        <div id="ly-label" data-layout-ignore>kinetic-lyric-video · word-punch</div>
      </div>
      <script>
        (function () {
          const FPS = 30;
          const BEAT = 60 / 100;
          const ON0 = 0.3;
          const LEAD = 2 / FPS;
          const CAP = 0.26 * 1080;
          const words = [0, 1, 2, 3, 4, 5, 6].map((i) => document.getElementById("ly-w" + i));
          const all = Array.from(document.querySelectorAll(".ly-w"));

          function mulberry32(a) {
            return function () {
              a |= 0;
              a = (a + 0x6d2b79f5) | 0;
              let t = Math.imul(a ^ (a >>> 15), 1 | a);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          document.fonts.load('400 100px "Anton"', "SAYITSOFTTHENLOUD,").then(() => {
            const c = document.createElement("canvas").getContext("2d");
            c.font = '400 100px "Anton"';
            const capR = c.measureText("H").actualBoundingBoxAscent / 100;
            all.forEach((w) => {
              const s = parseFloat(w.dataset.scale);
              const fs = Math.min((CAP * s) / capR, 1600 / (c.measureText(w.textContent).width / 100));
              w.querySelector("span").style.fontSize = fs.toFixed(1) + "px";
            });

            // grain tiles, seeded, swapped every 2 f
            const g = document.getElementById("ly-grain").getContext("2d");
            const tiles = [];
            for (let k = 0; k < 4; k++) {
              const rnd = mulberry32(77 + k * 131);
              const img = g.createImageData(960, 540);
              for (let i = 0; i < img.data.length; i += 4) {
                const v = Math.floor(rnd() * 255);
                img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
                img.data[i + 3] = 255;
              }
              tiles.push(img);
            }
            let last = -1;
            const grain = (t) => {
              const k = Math.floor((t * FPS) / 2) % 4;
              if (k !== last) {
                g.putImageData(tiles[k], 0, 0);
                last = k;
              }
            };

            const tl = gsap.timeline({ paused: true });
            const clock = { t: 0 };
            tl.fromTo(clock, { t: 0 }, { t: 5.4, duration: 5.4, ease: "none", onUpdate: () => grain(clock.t) }, 0);
            grain(0);

            const enter = (el, on, dir) => {
              tl.fromTo(el, { x: 160 * dir, opacity: 0 }, { x: 0, opacity: 1, duration: 5 / FPS, ease: "expo.out", immediateRender: false }, on - LEAD);
            };
            words.forEach((w, i) => {
              const on = ON0 + i * BEAT;
              const dir = i % 2 === 0 ? -1 : 1; // alternate entry sides
              enter(w, on, dir);
              if (i < words.length - 1) {
                const next = ON0 + (i + 1) * BEAT;
                // pushed out the way the next word travels; slide 4 f, ink gone in 2 f so the two words barely overlap
                tl.to(w, { x: 240 * dir, duration: 4 / FPS, ease: "power3.in" }, next);
                tl.to(w, { opacity: 0, duration: 2 / FPS, ease: "none" }, next);
              }
            });
            // Hook on the chorus downbeat: inverted frame (hard cut 1 f early), accent duplicate 1 f late, chromatic kick 2 f.
            const hookOn = ON0 + 6 * BEAT;
            tl.set("#ly-bg", { backgroundColor: "#F5F5F0" }, hookOn - 1 / FPS);
            tl.set("#ly-w6 span", { color: "#0A0A0A" }, hookOn - 1 / FPS);
            tl.set("#ly-label", { color: "#0A0A0A" }, hookOn - 1 / FPS);
            tl.fromTo("#ly-accent", { x: -160, opacity: 0 }, { x: 0, opacity: 1, duration: 5 / FPS, ease: "expo.out", immediateRender: false }, hookOn - LEAD + 1 / FPS);
            tl.set("#ly-kick-r", { opacity: 0.9, x: 6 }, hookOn);
            tl.set("#ly-kick-c", { opacity: 0.9, x: -6 }, hookOn);
            tl.set(["#ly-kick-r", "#ly-kick-c"], { opacity: 0 }, hookOn + 2 / FPS);
            window.__timelines["lyric"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
