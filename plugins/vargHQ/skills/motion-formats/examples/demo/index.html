<!doctype html>
<!--
  motion-formats preview reel: four formats in sequence, 1920x1080 at 30 fps, silent.
    0.0 - 3.5 s    vhs-bouncing-logo · pal-50       (last 3 s of the 4.5 s path: corner hit at 3.0 s, 0.5 s hold)
    3.5 - 8.0 s    pixel-runner-crt · console-16    (power-on, run, three jumps landing on 120 BPM downbeats, power-off)
    8.0 - 10.5 s   wave-wordmark · lift             (2.0 s sting + hold)

-->
<html lang="en" data-resolution="landscape">

      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15.9"
      data-width="1920"
      data-height="1080"
    >
      <div

        data-composition-id="vhs"
        data-composition-src="compositions/vhs.html"

        data-height="1080"
