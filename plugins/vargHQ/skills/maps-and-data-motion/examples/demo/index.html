<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>maps-and-data-motion preview</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b1220;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #0b1220;
      }
    </style>
  </head>
  <body>
    <!--
      Four templates cut on the downbeats of a synthesized 120 BPM track (beat = 0.5 s):
        0.0 – 4.5   vector-route-map · night-transit   (Natural Earth, Lisbon -> Helsinki great circle)
        4.5 – 8.5   self-drawing-chart · bars           (illustrative sample data)
        8.5 – 12.5  count-up-stat · center-hero
        12.5 – 16.0 audio-visualizer · silk-ribbons     (driven by the same track, analysed offline)
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="route"
        data-composition-id="route"
        data-composition-src="compositions/route.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="chart"
        data-composition-id="chart"
        data-composition-src="compositions/chart.html"
        data-start="4.5"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="stat"
        data-composition-id="stat"
        data-composition-src="compositions/stat.html"
        data-start="8.5"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="ribbons"
        data-composition-id="ribbons"
        data-composition-src="compositions/ribbons.html"
        data-start="12.5"
        data-duration="3.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <audio
        id="beat"
        class="clip"
        src="assets/beat.m4a"
        data-start="0"
        data-duration="16"
        data-track-index="5"
        data-volume="0.9"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
