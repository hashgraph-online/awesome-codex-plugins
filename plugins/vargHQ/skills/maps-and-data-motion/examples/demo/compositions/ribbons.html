          const amp = H * (P.amp[0] + (P.amp[1] - P.amp[0]) * Math.min(1, lvl)) * (1 + P.beatPulse * pulse * (i < 2 ? 1 : 0.5)) * (0.4 + 0.6 * enter);
          const rate = P.phaseRate[0] + ((P.phaseRate[1] - P.phaseRate[0]) * i) / 4;
          const phi = rate * filmT + i * 0.21 + P.idleCycles * t * 0.3;
          const k = 0.9 + i * 0.22;
          const cy = 540 + (2 - i) * 92 + 20;
          const col = P.colors[i];
          const strands = 16;
          for (let s = strands; s >= 0; s--) {
            const main = s === 0;
            const f = s / strands;
            ctx.beginPath();
            for (let x = -20; x <= W + 20; x += 8) {
              const u = x / W;
              const env = Math.sin(Math.PI * Math.min(1, Math.max(0, (u + 0.02) / 1.04))); // ribbons taper at the edges
              const a = amp * (1 - 0.45 * f) * (0.35 + 0.65 * env);
              const yy =
                cy +
                a * Math.sin(2 * Math.PI * (k * u + phi + 0.035 * s)) +
                0.4 * a * Math.sin(2 * Math.PI * (2.3 * k * u - phi - 0.02 * s)) +
                s * 2.2;
              if (x === -20) ctx.moveTo(x, yy);
              else ctx.lineTo(x, yy);
            }
            ctx.strokeStyle = col;
            if (main) {
              ctx.lineWidth = P.line[0] + (P.line[1] - P.line[0]) * Math.min(1, lvl);
              ctx.globalAlpha = 0.95;
              ctx.shadowColor = col;
              ctx.shadowBlur = P.glow;
            } else {
              ctx.lineWidth = 1.2;
              ctx.globalAlpha = 0.16 * (1 - f) + 0.04;
              ctx.shadowBlur = 0;
            }
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = "source-over";
        // text reacts at most 4 % (here 2 %)
        const te = Math.min(1, Math.max(0, (t - 0.1) / 0.4));
        title.style.opacity = (te * te * (3 - 2 * te)).toFixed(3);
        title.style.transform = `scale(${(1 + 0.02 * pulse).toFixed(4)})`;
      }

      const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
      tl.to({ p: 0 }, { p: 1, duration: D, ease: "none" }, 0);
      tl.fromTo("#rb-lbl", { opacity: 0 }, { opacity: 0.6, duration: 0.3, ease: "power1.out" }, 0.2);
      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["ribbons"] = tl;
    })();
  </script>
</template>
