  <script>
    (function () {
      // preset vector-route-map.night-transit + shared beats from assets/presets/vector-route-map.json,
      // compressed from 8 s to 4.5 s (see README)
      const D = 4.5;
      const T = { mapIn: [0, 0.5], pinA: [0.45, 0.8], draw: [0.85, 3.05], arrive: [3.05, 3.65], ant: 3.25 };
      const bez = (x1, y1, x2, y2) => {
        // cubic-bezier easing (CSS), solved with Newton steps
        return (t) => {
          let u = t;
          for (let i = 0; i < 8; i++) {
            const x = 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u - t;
            const dx = 3 * (1 - u) * (1 - u) * x1 + 6 * (1 - u) * u * (x2 - x1) + 3 * u * u * (1 - x2);
            if (Math.abs(dx) < 1e-6) break;
            u = Math.min(1, Math.max(0, u - x / dx));
          }
          return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
        };
      };
      const emphDecel = bez(0.05, 0.7, 0.1, 1);
      const drawEase = bez(0.37, 0, 0.63, 1);
      const pop = gsap.parseEase("back.out(1.6)");
      const ringEase = gsap.parseEase("power2.out");
      const clamp = (v) => Math.max(0, Math.min(1, v));
      const prog = (t, [a, b]) => clamp((t - a) / (b - a));

      const map = document.getElementById("rt-map");
      const line = document.getElementById("rt-line");
      const glow = document.getElementById("rt-glow");
      const casing = document.getElementById("rt-casing");
      const ant = document.getElementById("rt-ant");
      const plane = document.getElementById("rt-plane");
      const pinA = document.getElementById("rt-pin-a");
      const pinB = document.getElementById("rt-pin-b");
      const ring = document.getElementById("rt-ring");
      const title = document.getElementById("rt-title");
      const cityA = document.getElementById("rt-city-a");
      const cityB = document.getElementById("rt-city-b");
      // the route is a polyline (great-circle samples from tools/build-map.ts): measure it from its own
      // coordinates once, so nothing reads the DOM at render time
      const RP = line
        .getAttribute("d")
        .replace(/^M/, "")
        .split(" L")
        .map((q) => q.trim().split(/\s+/).map(Number));
      const CUM = [0];
      for (let i = 1; i < RP.length; i++) CUM.push(CUM[i - 1] + Math.hypot(RP[i][0] - RP[i - 1][0], RP[i][1] - RP[i - 1][1]));
      const L = CUM[CUM.length - 1];
      const A = [592.9, 880];
      const B = [1327.1, 210];
      // labels sit on the outer side of the route
      cityA.style.left = A[0] - 28 + "px";
      cityA.style.top = A[1] + 24 + "px";
      cityA.style.transform = "translateX(-100%)";
      cityB.style.left = B[0] + 30 + "px";
      cityB.style.top = B[1] - 22 + "px";
      for (const p of [line, glow, casing]) p.style.strokeDasharray = `${L} ${L}`;
      function pointAt(s) {
        s = Math.max(0, Math.min(L, s));
        let i = 1;
        while (i < CUM.length - 1 && CUM[i] < s) i++;
        const k = (s - CUM[i - 1]) / (CUM[i] - CUM[i - 1] || 1);
        return { x: RP[i - 1][0] + (RP[i][0] - RP[i - 1][0]) * k, y: RP[i - 1][1] + (RP[i][1] - RP[i - 1][1]) * k };
      }
      function render(t) {
        const mi = emphDecel(prog(t, T.mapIn));
        map.style.opacity = mi.toFixed(3);
        map.style.transform = `scale(${(1.03 - 0.03 * mi).toFixed(4)})`;
        const ti = emphDecel(prog(t, [0.15, 0.65]));
        title.style.opacity = ti.toFixed(3);
        title.style.transform = `translateY(${(16 * (1 - ti)).toFixed(1)}px)`;

        const pa = pop(prog(t, T.pinA));
        pinA.setAttribute("transform", `translate(${A[0]} ${A[1]}) scale(${pa.toFixed(3)})`);
        const ca = emphDecel(prog(t, [0.55, 0.95]));
        cityA.style.opacity = ca.toFixed(3);

        // one progress value drives the stroke and the traveller
        const p = drawEase(prog(t, T.draw));
        const off = (L * (1 - p)).toFixed(2);
        for (const el of [line, glow, casing]) el.style.strokeDashoffset = off;
        const s = p * L;
        const pt = pointAt(s);
        const pa2 = pointAt(Math.max(0, s - 2));
        const pb2 = pointAt(Math.min(L, s + 2));
        const ang = (Math.atan2(pb2.y - pa2.y, pb2.x - pa2.x) * 180) / Math.PI;
        const flying = t >= T.draw[0] && t < T.arrive[0] + 0.25;
        const fadeIn = prog(t, [T.draw[0], T.draw[0] + 0.15]);
        const fadeOut = 1 - prog(t, [T.arrive[0], T.arrive[0] + 0.25]);
        plane.setAttribute("opacity", flying ? Math.min(fadeIn, fadeOut).toFixed(3) : "0");
        plane.setAttribute("transform", `translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)}) rotate(${ang.toFixed(2)})`);

        const pb = pop(prog(t, [T.arrive[0], T.arrive[0] + 0.35]));
        pinB.setAttribute("transform", `translate(${B[0]} ${B[1]}) scale(${pb.toFixed(3)})`);
        const r = prog(t, T.arrive);
        ring.setAttribute("r", (13 * (1 + 0.8 * ringEase(r))).toFixed(2));
        ring.setAttribute("opacity", t >= T.arrive[0] ? (0.9 * (1 - r)).toFixed(3) : "0");
        const cb = emphDecel(prog(t, [T.arrive[0] + 0.1, T.arrive[0] + 0.5]));
        cityB.style.opacity = cb.toFixed(3);

        // ant path on the hold: solid line drops to 40 %, dashes crawl 40 px/s toward Helsinki
        const a = prog(t, [T.ant, T.ant + 0.3]);
        line.setAttribute("opacity", (1 - 0.6 * a).toFixed(3));
        ant.setAttribute("opacity", a.toFixed(3));
        ant.style.strokeDashoffset = (-40 * Math.max(0, t - T.ant)).toFixed(2);
      }

      const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
      tl.to({ p: 0 }, { p: 1, duration: D, ease: "none" }, 0);
      tl.fromTo("#rt-lbl", { opacity: 0 }, { opacity: 0.6, duration: 0.3, ease: "power1.out" }, 0.2);
      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["route"] = tl;
    })();
  </script>
