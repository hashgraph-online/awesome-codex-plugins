<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<!--
  video-moodboard board. Edit only the JSON in <script id="board">: every section draws from it, in ranked order.
  Light angle: degrees around the subject seen from above, 0 = from the camera, 90 = camera-left, 180 = behind,
  270 = camera-right. Framing x/y: subject centre as a fraction of the frame (0-1); h: subject height as a fraction.
  Fonts load from Google Fonts by family name. Images can be relative paths (refs/01.jpg) or URLs.
-->
<script id="board" type="application/json">
{
  "title": "LAST BUS",
  "look": "Late-1990s city night drama on 35mm tungsten film.",
  "format": ["15 s", "16:9", "YouTube pre-roll"],
  "references": [
    {"n": 1, "img": "", "source": "FrameThrower", "query": "night street, sodium streetlight, rain", "lends": "light", "not": "the actor, the street signs", "rights": "link-only", "url": "https://framethrower.ai"},
    {"n": 2, "img": "", "source": "Screenmusings Color Lab", "query": "teal shadows, orange highlights", "lends": "palette", "not": "the set", "rights": "link-only", "url": "https://screenmusings.org"},
    {"n": 3, "img": "", "source": "Refs", "query": "slow push-in on a lone figure", "lends": "motion", "not": "the product", "rights": "link-only", "url": "https://refs.video"}
  ],
  "light": {
    "key": {"source": "Sodium streetlight", "angle": 60, "height": "high", "hardness": "hard", "kelvin": 2000, "color": "#E07A2E"},
    "fill": {"source": "Advert panel", "angle": 290, "hardness": "soft", "kelvin": 9000, "color": "#6FA8C7"},
    "notes": "Wet-pavement reflections; deep black shadows; no other sources. Same in every shot."
  },
  "subject": {
    "img": "https://s3.varg.ai/files/194b94d0-58ff-4e8b-91de-4f1959d04013/file_c12f2f22315f.png",
    "identity": "Woman, 30, shoulder-length black hair, charcoal wool coat to mid-calf, red umbrella #C1272D. Sheet on 18% grey, shadowless light."
  },
  "framing": {"aspect": "16:9", "shot": "Wide", "height": "Knee height", "angle": "Eye-level tilt 0°", "lens": "24mm", "x": 0.7, "y": 0.6, "h": 0.3, "notes": "Dark empty space upper left."},
  "palette": {
    "from": "reference 2, scripts/palette.py extract",
    "swatches": [
      {"hex": "#0F3B3F", "role": "Shadows", "share": 0.55},
      {"hex": "#E07A2E", "role": "Highlights", "share": 0.3},
      {"hex": "#C1272D", "role": "Accent (umbrella only)", "share": 0.05},
      {"hex": "#1A1A1A", "role": "Blacks", "share": 0.1}
    ],
    "contrast": "Cold teal base, warm sodium pools",
    "grade": "Low contrast, lifted blacks, nothing else saturated"
  },
  "motion": {
    "asl": "2.5 s",
    "shots": [
      {"n": 1, "dur": 4, "move": "Slow push-in, wide to medium", "action": "Lowers the umbrella at 2 s"},
      {"n": 2, "dur": 2.5, "move": "Static", "action": "Bus headlights sweep across her face"},
      {"n": 3, "dur": 3, "move": "Slow pull-back", "action": "She steps on; doors close"}
    ],
    "ref": "Reference 3"
  },
  "texture": {"medium": "Kodak Vision3 500T, 35mm", "flaws": ["fine grain", "halation around every light", "slightly soft", "no digital sharpening"], "post": "+2% grain, one compression pass"},
  "type": {"text": "LAST BUS", "family": "Barlow Condensed", "weight": 700, "size": 48, "color": "#FFFFFF", "tracking": "0.2em", "case": "uppercase", "x": 0.05, "y": 0.89, "notes": "Set in code (HyperFrames or Remotion), never by the video model."},
  "sound": {"voice": "None", "music": "None until the bus arrives", "room": "Rain on the shelter roof, distant traffic"},
  "never": ["cinematic", "evenly lit", "perfect symmetry", "invented hex", "Inter / Roboto / Arial", "purple gradients", "text drawn by the model"],
  "stills": [
    {"img": "https://s3.varg.ai/files/194b94d0-58ff-4e8b-91de-4f1959d04013/file_7739913e0711.png", "label": "Nano Banana 2.1"},
    {"img": "https://s3.varg.ai/files/194b94d0-58ff-4e8b-91de-4f1959d04013/file_fbc6d63647fd.jpg", "label": "Seedream 5 Pro"}
  ],
  "checks": [
    {"line": "Palette", "target": "teal / sodium orange / one red; ΔE to the hex set", "results": ["2/2 · ΔE 20.6", "1.5/2 · ΔE 17.9"], "pass": [true, true]},
    {"line": "Light", "target": "hard key high camera-left, cold fill right", "results": ["1.5/2", "1.5/2"], "pass": [true, true]},
    {"line": "Framing", "target": "wide, knee height, right third", "results": ["2/2", "1/2 · Dutch tilt"], "pass": [true, false]},
    {"line": "Texture", "target": "fine grain + halation at 100%", "results": ["1/2 · too clean", "2/2"], "pass": [false, true]},
    {"line": "Motion cue", "target": "rain streaks, coat mid-gust", "results": ["2/2", "2/2"], "pass": [true, true]}
  ],
  "checks_note": "Two blind judges, 0-2 per line (from the 48-still test). Fixes: Nano Banana texture -> grain in post; Seedream framing -> attach a reference frame. Night looks sit far from any hex by ΔE, so judge palette against the reference frame (--ref)."
}
</script>
<style>
:root{--bg:#070708;--panel:#0E0E0F;--panel2:#151516;--line:#282829;--text:#FFFFFF;--dim:#737373;--accent:#FF5315;--ok:#3FB37F;--bad:#FF1E12;
--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Inter,system-ui,-apple-system,sans-serif;--head:Poppins,Inter,system-ui,sans-serif}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F7F7F8;--panel:#FFFFFF;--panel2:#F1F1F2;--line:#E4E4E7;--text:#070708;--dim:#737373;--accent:#FF5315;--ok:#1E8A55;--bad:#D61A10}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans)}
.wrap{max-width:1280px;margin:0 auto;padding:32px 16px 64px}
header h1{font:700 48px/1 var(--head);margin:0 0 8px;letter-spacing:-.02em}
header p{margin:0;color:var(--dim);font-size:17px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font:12px var(--mono);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:18px;min-width:0}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:900px){.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}.rk{font:600 12px var(--mono);color:var(--accent)}
.hd h2{font:600 15px var(--head);margin:0;text-transform:uppercase;letter-spacing:.08em}.hd .nt{color:var(--dim);font-size:12px;margin-left:auto;text-align:right}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ref{border:1px solid var(--line);border-radius:5px;overflow:hidden}.ref .im{aspect-ratio:16/9;background:var(--panel2) center/cover;display:flex;align-items:center;justify-content:center;color:var(--dim);font:12px var(--mono);text-align:center;padding:8px}
.ref .tx{padding:8px 10px;font-size:13px}.ref b{color:var(--accent);text-transform:uppercase;font:600 11px var(--mono)}
.badge{float:right;font:11px var(--mono);padding:1px 6px;border-radius:4px;border:1px solid var(--line)}.badge.feed{color:var(--ok);border-color:var(--ok)}
.sw{display:flex;height:120px;border-radius:5px;overflow:hidden}.sw div{display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:11px var(--mono);color:#fff;text-shadow:0 1px 2px #0008;min-width:56px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}.kv dt{color:var(--dim)}.kv dd{margin:0}
.frame{container-type:inline-size;position:relative;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.frame .g{position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(33.33% - .5px),var(--line) calc(33.33% - .5px),var(--line) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),var(--line) calc(66.66% - .5px),var(--line) calc(66.66% + .5px),transparent calc(66.66% + .5px)),linear-gradient(0deg,transparent calc(33.33% - .5px),var(--line) calc(33.33% - .5px),var(--line) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),var(--line) calc(66.66% - .5px),var(--line) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.frame .sub{position:absolute;border:2px solid var(--accent);border-radius:40% 40% 4px 4px;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tl{display:flex;gap:4px}.tl div{border-radius:5px;background:color-mix(in srgb,var(--accent) 16%,var(--panel));border:1px solid var(--line);padding:8px;font-size:12px;min-width:0}
.tl b{display:block;font:600 11px var(--mono);color:var(--accent)}
.grain{height:70px;border-radius:5px;background:#777;position:relative;overflow:hidden}.grain svg{position:absolute;inset:0;width:100%;height:100%}
ul.fl{margin:8px 0 0;padding-left:18px;font-size:13px}
.never{display:flex;flex-wrap:wrap;gap:6px}.never span{font:12px var(--mono);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);border-radius:999px;padding:2px 10px;text-decoration:line-through}
.stills{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.stills figure{margin:0}.stills img{width:100%;border-radius:5px;display:block}
.stills figcaption{font:12px var(--mono);color:var(--dim);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--dim);font-weight:500}
.ok{color:var(--ok)}.no{color:var(--bad)}
.foot{margin-top:24px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const B = JSON.parse(document.getElementById('board').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const card = (rank, title, note, body, span) => `<section class="card ${span}"><div class="hd"><span class="rk">${rank}</span><h2>${title}</h2><span class="nt">${esc(note||'')}</span></div>${body}</section>`;
const kelvin = k => k <= 2500 ? 'warm' : k >= 6500 ? 'cold' : 'neutral';

function lightSvg(L){
  const cx=170, cy=120, R=88;
  const pos = (a, r=R) => { const t=a*Math.PI/180; return [cx - r*Math.sin(t), cy + r*Math.cos(t)]; };
  const lamp = (l, cls) => { if(!l) return ''; const [x,y]=pos(l.angle); const [sx,sy]=pos(l.angle,24); const [lx,ly]=pos(l.angle,R+22);
    const col=l.color||'#e9b872', hard=l.hardness==='hard';
    const anchor = Math.sin(l.angle*Math.PI/180) > 0.3 ? 'end' : Math.sin(l.angle*Math.PI/180) < -0.3 ? 'start' : 'middle';
    return `<line x1="${x}" y1="${y}" x2="${sx}" y2="${sy}" stroke="${col}" stroke-width="${hard?2.5:7}" stroke-opacity="${hard?.95:.35}" stroke-linecap="round"/>
      <circle cx="${x}" cy="${y}" r="10" fill="${col}"/>
      <text x="${lx}" y="${ly-4}" text-anchor="${anchor}" font-size="15" fill="currentColor">${esc(cls)}: ${esc(l.source)}</text>
      <text x="${lx}" y="${ly+13}" text-anchor="${anchor}" font-size="13" fill="var(--dim)">${l.kelvin?l.kelvin+'K · ':''}${esc(l.hardness||'')}</text>`; };
  return `<svg viewBox="-110 0 560 250" width="100%" style="color:var(--text);max-height:300px">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-dasharray="3 4"/>
    ${lamp(L.fill,'fill')}${lamp(L.key,'key')}
    <circle cx="${cx}" cy="${cy}" r="18" fill="var(--panel)" stroke="currentColor"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="11" fill="currentColor">subject</text>
    <rect x="${cx-14}" y="${cy+R+8}" width="28" height="16" rx="3" fill="var(--dim)"/><text x="${cx}" y="${cy+R+38}" text-anchor="middle" font-size="13" fill="var(--dim)">camera</text></svg>`;
}

function render(){
  const r = B.references||[], L = B.light||{}, F = B.framing||{}, P = B.palette||{}, M = B.motion||{}, X = B.texture||{}, T = B.type||{}, S = B.sound||{};
  const ar = (F.aspect||'16:9').split(':').map(Number);
  if (T.family) { const l=document.createElement('link'); l.rel='stylesheet'; l.href=`https://fonts.googleapis.com/css2?family=${encodeURIComponent(T.family)}:wght@${T.weight||400}&display=swap`; document.head.appendChild(l); }
  const total = (M.shots||[]).reduce((s,x)=>s+x.dur,0)||1;
  const html = `
  <header><h1>${esc(B.title)}</h1><p>${esc(B.look)}</p><div class="chips">${(B.format||[]).map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div></header>
  <div class="grid">
  ${card('01','References','each lends one thing', `<div class="refs">${r.map(x=>`<div class="ref"><div class="im" style="${x.img?`background-image:url('${esc(x.img)}')`:''}">${x.img?'':esc(x.query||'')}</div>
      <div class="tx"><span class="badge ${x.rights==='feed'?'feed':''}">${esc(x.rights)}</span><b>${esc(x.lends)}</b><br><a href="${esc(x.url)}" style="color:inherit">${esc(x.source)}</a><br><span style="color:var(--dim)">not: ${esc(x.not)}</span></div></div>`).join('')}</div>`,'s12')}
  ${card('02','Light', L.key?`${L.key.kelvin}K ${kelvin(L.key.kelvin)} key, ${L.key.hardness}, ${L.key.height}`:'', `${lightSvg(L)}<p style="font-size:13px;margin:6px 0 0">${esc(L.notes)}</p>`,'s4')}
  ${card('03','Subject lock','', `${B.subject?.img?`<img src="${esc(B.subject.img)}" style="width:100%;border-radius:5px">`:`<div class="frame" style="aspect-ratio:3/2;background:#777777;display:flex;align-items:center;justify-content:center;color:#222;font:12px var(--mono)">sheet on 18% grey</div>`}<p style="font-size:13px">${esc(B.subject?.identity)}</p>`,'s4')}
  ${card('04','Framing',`${F.shot||''} · ${F.lens||''}`, `<div class="frame" style="aspect-ratio:${ar[0]}/${ar[1]}"><div class="g"></div>
      <div class="sub" style="left:${(F.x-F.h*0.18)*100}%;top:${(F.y-F.h/2)*100}%;width:${F.h*36}%;height:${F.h*100}%"></div></div>
      <dl class="kv" style="margin-top:10px"><dt>Shot</dt><dd>${esc(F.shot)}</dd><dt>Camera</dt><dd>${esc(F.height)}, ${esc(F.angle)}</dd><dt>Lens</dt><dd>${esc(F.lens)}</dd><dt>Subject</dt><dd>${Math.round(F.h*100)}% of frame height at x ${Math.round(F.x*100)}%</dd></dl><p style="font-size:13px;margin:6px 0 0">${esc(F.notes)}</p>`,'s4')}
  ${card('05','Palette', P.from?`from ${P.from}`:'', `<div class="sw">${(P.swatches||[]).map(s=>`<div style="background:${esc(s.hex)};flex:${s.share||1}">${esc(s.hex)}<br>${esc(s.role)}</div>`).join('')}</div>
      <dl class="kv" style="margin-top:10px"><dt>Contrast</dt><dd>${esc(P.contrast)}</dd><dt>Grade</dt><dd>${esc(P.grade)}</dd></dl>`,'s7')}
  ${card('06','Motion',`average shot ${M.asl||''}`, `<div class="tl">${(M.shots||[]).map(s=>`<div style="flex:${s.dur/total}"><b>SHOT ${s.n} · ${s.dur}s</b>${esc(s.move)}<br><span style="color:var(--dim)">${esc(s.action)}</span></div>`).join('')}</div><p style="font-size:13px;margin:8px 0 0">Motion reference: ${esc(M.ref)}</p>`,'s5')}
  ${card('07','Texture', X.medium||'', `<div class="grain"><svg><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)" opacity=".55"/></svg></div>
      <ul class="fl">${(X.flaws||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul><p style="font-size:13px;margin:6px 0 0">Post: ${esc(X.post)}</p>`,'s4')}
  ${card('08','Type','set in code', `<div class="frame" style="aspect-ratio:16/9;background:#070708"><div style="position:absolute;left:${T.x*100}%;top:${T.y*100}%;transform:translateY(-100%);font-family:'${esc(T.family)}',sans-serif;font-weight:${T.weight};font-size:${(T.size||48)/1920*100}cqw;color:${esc(T.color)};letter-spacing:${esc(T.tracking)};text-transform:${esc(T.case)}">${esc(T.text)}</div></div>
      <p style="font:12px var(--mono);color:var(--dim);margin:8px 0 0">${esc(T.family)} ${T.weight} · ${T.size}px · ${esc(T.color)} · tracking ${esc(T.tracking)}</p><p style="font-size:13px;margin:4px 0 0">${esc(T.notes)}</p>`,'s4')}
  ${card('09','Sound','', `<dl class="kv"><dt>Voice</dt><dd>${esc(S.voice)}</dd><dt>Music</dt><dd>${esc(S.music)}</dd><dt>Room</dt><dd>${esc(S.room)}</dd></dl>`,'s4')}
  ${card('✕','Never','', `<div class="never">${(B.never||[]).map(n=>`<span>${esc(n)}</span>`).join('')}</div>`,'s12')}
  ${(B.stills||[]).length ? card('✓','Test stills and checks','approve before any video', `<div class="stills">${B.stills.map(s=>`<figure><img src="${esc(s.img)}" alt=""><figcaption>${esc(s.label)}</figcaption></figure>`).join('')}</div>
      <table><tr><th>Line</th><th>Target</th>${B.stills.map(s=>`<th>${esc(s.label)}</th>`).join('')}</tr>${(B.checks||[]).map(c=>`<tr><td>${esc(c.line)}</td><td>${esc(c.target)}</td>${c.results.map((v,i)=>`<td class="${c.pass[i]?'ok':'no'}">${c.pass[i]?'✓':'✕'} ${esc(v)}</td>`).join('')}</tr>`).join('')}</table><p style="font-size:12px;color:var(--dim);margin:8px 0 0">${esc(B.checks_note||'')}</p>`,'s12') : ''}
