  <script>
    const bez = (x1, y1, x2, y2) => (t) => {
      const cx = (u) => 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u;
      let lo = 0, hi = 1, u = t;
      for (let i = 0; i < 24; i++) {
        u = (lo + hi) / 2;
        if (cx(u) < t) lo = u; else hi = u;
      }
      return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
    };
    const ENTER = bez(0.05, 0.7, 0.1, 1);
    const EXIT = bez(0.3, 0, 0.8, 0.15);
    const RATING = 4.6;
    // star k spans [50k, 50k + 44]; 4.6 -> four full stars + 60% of the fifth
    const fillPx = Math.floor(RATING) * 50 + (RATING % 1) * 44;
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#rev-beams", { x: 0 }, { x: -40, duration: 4.3, ease: "none" }, 0);
    tl.fromTo("#rev-tag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.1);

    const t0 = 0.15;
    // card rises 56 px + fades, 0.45 s
    tl.fromTo("#rev-card", { y: 56, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: ENTER }, t0);
    // stars sweep left to right over 0.6 s power2.out from +0.35 s; the score counts in sync
    tl.fromTo(
      "#rev-gold",
      { clipPath: "inset(0px 244px 0px 0px)" },
      { clipPath: `inset(0px ${244 - fillPx}px 0px 0px)`, duration: 0.6, ease: "power2.out" },
      t0 + 0.35,
    );
    const score = { v: 0 };
    const scoreEl = document.querySelector("#rev-score");
    tl.fromTo(
      score,
      { v: 0 },
      {
        v: RATING,
        duration: 0.6,
        ease: "power2.out",
        onUpdate: () => {
          scoreEl.textContent = score.v.toFixed(1);
        },
      },
      t0 + 0.35,
    );
    // quote slides 12 px and fades in 0.3 s at +0.6 s; name and date row +0.1 s
    tl.fromTo(["#rev-title", "#rev-quote"], { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.06 }, t0 + 0.6);
    tl.fromTo("#rev-by", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, t0 + 0.7);
    // exit 0.25 s down + fade
    tl.to("#rev-card", { y: 32, opacity: 0, duration: 0.25, ease: EXIT }, 3.95);
    window.__timelines["review"] = tl;
