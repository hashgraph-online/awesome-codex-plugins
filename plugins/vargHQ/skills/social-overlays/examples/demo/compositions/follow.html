  <script>
    const bez = (x1, y1, x2, y2) => (t) => {
      const cx = (u) => 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u;
      let lo = 0, hi = 1, u = t;
      for (let i = 0; i < 24; i++) {
        u = (lo + hi) / 2;
        if (cx(u) < t) lo = u; else hi = u;
      }
      return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
    };
    const ENTER = bez(0.05, 0.7, 0.1, 1);
    const EXIT = bez(0.3, 0, 0.8, 0.15);
    const F = 1 / 30;
    const tl = gsap.timeline({ paused: true });

    // footage drift
    tl.fromTo("#fol-sky", { x: 0 }, { x: -30, duration: 3.8, ease: "none" }, 0);
    tl.fromTo("#fol-glints", { x: 0 }, { x: -70, duration: 3.8, ease: "none" }, 0);
    tl.fromTo("#fol-tag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.1);

    // card rises 48 px + fade, 0.45 s, emphasized decelerate
    tl.fromTo("#fol-card", { y: 48, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: ENTER }, 0.15);
    tl.set("#fol-label-following", { opacity: 0, y: 8 }, 0);
    tl.set("#fol-ripple", { scale: 0, opacity: 0 }, 0);

    // finger enters from off-frame bottom-right along a slight arc, 0.7 s
    tl.fromTo("#fol-finger", { x: 420, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power2.inOut" }, 0.6);
    tl.fromTo("#fol-finger", { y: 760 }, { y: 0, duration: 0.7, ease: "power3.out" }, 0.6);

    // press at 1.40 s: button 1 -> 0.94 in 3 f, finger 1 -> 0.9; release 4 f back.out(1.7)
    const press = 1.4;
    tl.to("#fol-btn", { scale: 0.94, duration: 3 * F, ease: "power2.out" }, press);
    tl.to("#fol-finger", { scale: 0.9, duration: 3 * F, ease: "power2.out" }, press);
    tl.to("#fol-btn", { scale: 1, duration: 4 * F, ease: "back.out(1.7)" }, press + 3 * F);
    tl.to("#fol-finger", { scale: 1, duration: 4 * F, ease: "back.out(1.7)" }, press + 3 * F);
    // tap ripple 0 -> 2.2x over 0.4 s, opacity 0.35 -> 0
    tl.fromTo("#fol-ripple", { scale: 0, opacity: 0.35 }, { scale: 2.2, opacity: 0, duration: 0.4, ease: "power2.out" }, press);

    // state flip at 1.50 s: fill cross-fade 0.2 s, label swap with an 8 px slide
    const flip = 1.5;
    tl.to("#fol-btn-fill", { opacity: 0, duration: 0.2, ease: "power1.inOut" }, flip);
    tl.to("#fol-label-follow", { opacity: 0, y: -8, duration: 0.2, ease: "power2.out" }, flip);
    tl.to("#fol-label-following", { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, flip + 0.04);
    // finger parks 40 px below the button
    tl.to("#fol-finger", { y: 40 + 36, duration: 0.35, ease: "power2.out" }, flip + 0.1);

    // exit: card down 32 px + fade, 8 f, emphasized accelerate
    tl.to("#fol-card", { y: 32, opacity: 0, duration: 0.25, ease: EXIT }, 3.3);
    tl.to("#fol-finger", { opacity: 0, duration: 0.2, ease: EXIT }, 3.25);
    window.__timelines["follow"] = tl;
  </script>
