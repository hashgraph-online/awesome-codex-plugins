  <script>
    // cubic-bezier() as a GSAP ease (Material 3 motion tokens from the preset)
    const bez = (x1, y1, x2, y2) => (t) => {
      const cx = (u) => 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u;
      let lo = 0, hi = 1, u = t;
      for (let i = 0; i < 24; i++) {
        u = (lo + hi) / 2;
        if (cx(u) < t) lo = u; else hi = u;
      }
      return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
    };
    const ENTER = bez(0.05, 0.7, 0.1, 1);
    const EXIT = bez(0.3, 0, 0.8, 0.15);
    const tl = gsap.timeline({ paused: true });
    // the "footage": slow parallax drift, constant over the scene
    tl.fromTo("#cta-sky", { y: 0 }, { y: -24, duration: 3.4, ease: "none" }, 0);
    tl.fromTo("#cta-hills-far", { x: 0 }, { x: -18, duration: 3.4, ease: "none" }, 0);
    tl.fromTo("#cta-hills-mid", { x: 0 }, { x: -36, duration: 3.4, ease: "none" }, 0);
    tl.fromTo("#cta-hills-near", { x: 0 }, { x: -60, duration: 3.4, ease: "none" }, 0);
    tl.fromTo("#cta-tag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.1);

    // floating-pill preset: pop 0.35 s back.out(1.7), scale 0.6 -> 1
    const t0 = 0.8;
    tl.fromTo("#cta-pill", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.7)" }, t0);
    tl.fromTo("#cta-label", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, t0 + 0.08);
    tl.fromTo("#cta-arrow", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, t0 + 0.12);
    // disclosure tag beside the pill
    tl.fromTo("#cta-ad", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: ENTER }, t0 + 0.15);
    // attention beat at +1.2 s: arrow nudges +8 px and back once
    tl.fromTo("#cta-arrow", { x: 0 }, { x: 8, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, t0 + 1.2);
    // exit 0.25 s, Material emphasized accelerate
    tl.to(["#cta-pill", "#cta-ad"], { opacity: 0, y: 16, duration: 0.25, ease: EXIT }, 3.0);
    window.__timelines["cta"] = tl;
  </script>
