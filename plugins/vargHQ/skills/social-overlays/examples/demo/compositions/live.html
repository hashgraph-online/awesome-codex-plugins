  <script>
    const bez = (x1, y1, x2, y2) => (t) => {
      const cx = (u) => 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u;
      let lo = 0, hi = 1, u = t;
      for (let i = 0; i < 24; i++) {
        u = (lo + hi) / 2;
        if (cx(u) < t) lo = u; else hi = u;
      }
      return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
    };
    const ENTER = bez(0.05, 0.7, 0.1, 1);
    const EXIT = bez(0.3, 0, 0.8, 0.15);
    const tl = gsap.timeline({ paused: true });

    // footage: two bokeh layers drifting at different speeds
    tl.fromTo("#live-bokeh-far", { x: 0, y: 0 }, { x: -24, y: -10, duration: 3.5, ease: "none" }, 0);
    tl.fromTo("#live-bokeh-near", { x: 0, y: 0 }, { x: -60, y: -20, duration: 3.5, ease: "none" }, 0);
    tl.fromTo("#live-tag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.1);

    // in at 0.2 s: pill slides from x-24 + fade, 0.3 s; count chip +0.1 s
    tl.fromTo("#live-pill", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: ENTER }, 0.2);
    tl.fromTo("#live-chip", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: ENTER }, 0.3);
    tl.fromTo("#live-note", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.45);

    // dot pulse: period 1.0 s, scale 1 -> 1.35 -> 1, opacity 1 -> 0.55 -> 1, sine.inOut
    tl.fromTo("#live-dot", { scale: 1, opacity: 1 }, { scale: 1.35, opacity: 0.55, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.3);

    // seeded ticks (mulberry32(42): every 0.9-1.4 s, +0.3-2%): 1,184 -> 1,196 -> 1,212
    // shown as 3 significant figures, truncated: 1.18K -> 1.19K -> 1.21K; digits roll 8 px up in 0.2 s
    tl.set(["#live-n1", "#live-n2"], { opacity: 0 }, 0);
    const ticks = [1.55, 2.88];
    ticks.forEach((t, i) => {
      tl.to(`#live-n${i}`, { y: -8, opacity: 0, duration: 0.2, ease: "power2.out" }, t);
      tl.fromTo(`#live-n${i + 1}`, { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "power2.out" }, t);
    });

    // out at 3.25 s: 0.2 s fade + x-16
    tl.to(["#live-badge", "#live-note"], { x: -16, opacity: 0, duration: 0.2, ease: EXIT }, 3.25);
    window.__timelines["live"] = tl;
  </script>
