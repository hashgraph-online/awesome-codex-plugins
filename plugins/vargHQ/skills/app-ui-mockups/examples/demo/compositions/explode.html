  <script>
    const tl = gsap.timeline({ paused: true });
    // z by hierarchy, relative to the layer below: minor gaps 90 px, hero card +220 px on top
    // absolute z: cards 90, content 180, action 270, hero 490 (total depth 490 px < 60% of 1080)
    const L = [
      { sel: "#ex-l0", rel: 0, abs: 0, sh: "#ex-shell" },
      { sel: "#ex-l1", rel: 90, abs: 90, sh: ".ex-sh1" },
      { sel: "#ex-l2", rel: 90, abs: 180, sh: null },
      { sel: "#ex-l4", rel: 90, abs: 270, sh: "#ex-btn" },
      { sel: "#ex-l3", rel: 220, abs: 490, sh: "#ex-hero" },
    ];
    const shadow = (z) => {
      const a = (0.25 - 0.13 * (z / 490)).toFixed(3);
      return `0px ${(0.12 * z).toFixed(1)}px ${(0.35 * z).toFixed(1)}px rgba(0,0,0,${a})`;
    };

    tl.fromTo("#ex-tag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.1);
    // 0-0.4 s: flat screen fades in, scale 0.95 -> 1
    tl.fromTo("#ex-stage", { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 0);
    // 0.4-1.4 s: tilt to the three-quarter view (rotateX 55, rotateZ -35) and explode, stagger 0.07 s bottom -> top
    tl.fromTo("#ex-stage", { rotationX: 0, rotationZ: 0, y: 0 }, { rotationX: 55, rotationZ: -35, y: 0, duration: 1.0, ease: "power3.out" }, 0.4);
    // frame the deep stack: pull back while exploded, return for the flat end screen
    tl.fromTo("#ex-zoom", { scale: 1, y: 0 }, { scale: 0.76, y: 10, duration: 1.0, ease: "power3.out" }, 0.4);
    tl.to("#ex-zoom", { scale: 1, y: 0, duration: 1.1, ease: "power3.inOut" }, 2.6);
    L.forEach((l, i) => {
      tl.fromTo(l.sel, { z: 0 }, { z: l.rel, duration: 1.0 - 0.07 * (L.length - 1), ease: "power3.out" }, 0.4 + 0.07 * i);
      if (l.sh) tl.fromTo(l.sh, { boxShadow: shadow(0) }, { boxShadow: shadow(l.abs), duration: 0.72, ease: "power3.out" }, 0.4 + 0.07 * i);
    });
    // 1.4-2.6 s: hold with a slow 25 deg orbit, sine.inOut
    tl.to("#ex-stage", { rotationZ: -10, duration: 1.2, ease: "sine.inOut" }, 1.4);
    // 2.6-3.7 s: collapse top -> bottom, stagger 0.06 s, power3.inOut, and untilt
    const cd = 1.1 - 0.06 * (L.length - 1);
    [...L].reverse().forEach((l, i) => {
      tl.to(l.sel, { z: 0, duration: cd, ease: "power3.inOut" }, 2.6 + 0.06 * i);
      if (l.sh) tl.to(l.sh, { boxShadow: shadow(0), duration: cd, ease: "power3.inOut" }, 2.6 + 0.06 * i);
    });
    tl.to("#ex-stage", { rotationX: 0, rotationZ: 0, duration: 1.1, ease: "power3.inOut" }, 2.6);
    // 3.7-4.0 s: dead-still final screen
    window.__timelines["explode"] = tl;
