          <svg class="ag-icon" id="ag-c2" viewBox="0 0 28 28"><path d="M6 14.5l5 5L22 8.5" fill="none" stroke="#98c379" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /></svg>

        <div class="ag-row ag-tool" id="ag-t3">
          <svg class="ag-icon ag-spin" id="ag-s3" viewBox="-14 -14 28 28"><g fill="#d97757"><circle cx="0" cy="-10" r="3" /><circle cx="7.07" cy="-7.07" r="3" opacity="0.85" /><circle cx="10" cy="0" r="3" opacity="0.7" /><circle cx="7.07" cy="7.07" r="3" opacity="0.55" /><circle cx="0" cy="10" r="3" opacity="0.42" /><circle cx="-7.07" cy="7.07" r="3" opacity="0.3" /><circle cx="-10" cy="0" r="3" opacity="0.2" /><circle cx="-7.07" cy="-7.07" r="3" opacity="0.12" /></g></svg>

  <script>
    const tl = gsap.timeline({ paused: true });
    const PROMPT = document.querySelector("#ag-typed").textContent;
    const SUMMARY = document.querySelector("#ag-sum-text").textContent;
    // preset gap table (ms per character, seeded "demo"), +120 ms at a space
    const GAPS = [100, 33, 200, 133, 200, 33, 67, 33, 100, 67, 33, 67, 67, 67, 133, 67, 33, 67, 100, 100, 67, 133, 100, 33, 100, 33, 167, 33, 100, 100];

    tl.fromTo("#ag-tag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.1);
    // 0-0.4 s: window settles, scale 0.97 -> 1, ease-out
    tl.fromTo("#ag-window", { scale: 0.97, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 0);

    // hidden until their beat
    tl.set(["#ag-echo", "#ag-t1", "#ag-t2", "#ag-t3", "#ag-c1", "#ag-c2", "#ag-c3", "#ag-diff", "#ag-pass", "#ag-sum"], { opacity: 0 }, 0);

    // prompt typed from 0.35 s on the gap table
    let t = 0.35;
    for (let i = 0; i < PROMPT.length; i++) {
      t += GAPS[i % GAPS.length] / 1000 + (PROMPT[i] === " " ? 0.12 : 0);
      tl.set("#ag-typed", { width: `${i + 1}ch` }, t);
    }
    const enter = t + 0.2; // Enter beat
    tl.set("#ag-typed", { width: "0ch" }, enter);
    tl.fromTo("#ag-echo", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, enter);

    // tool lines every 0.5 s, each with a 0.6 s spinner (frame every 100 ms = 3 f), then a done mark
    const tools = [
      { row: "#ag-t1", spin: "#ag-s1", check: "#ag-c1", extra: null },
      { row: "#ag-t2", spin: "#ag-s2", check: "#ag-c2", extra: "#ag-diff" },
      { row: "#ag-t3", spin: "#ag-s3", check: "#ag-c3", extra: "#ag-pass" },
    ];
    const firstTool = enter + 0.25;
    tools.forEach((tool, k) => {
      const s = firstTool + k * 0.5;
      tl.fromTo(tool.row, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, s);
      for (let f = 0; f < 6; f++) tl.set(tool.spin, { rotation: f * 45 }, s + f * 0.1);
      tl.set(tool.spin, { opacity: 0 }, s + 0.6);
      tl.set(tool.check, { opacity: 1 }, s + 0.6);
      if (tool.extra) tl.fromTo(tool.extra, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, s + 0.6);
    });

    // summary streams at 60 cps in word bursts, no caret
    const sumStart = firstTool + 2 * 0.5 + 0.66;
    tl.set("#ag-sum", { opacity: 1 }, sumStart);
    let idx = 0;
    SUMMARY.split(" ").forEach((w) => {
      idx += w.length + 1;
      tl.set("#ag-sum-text", { width: `${Math.min(idx, SUMMARY.length)}ch` }, sumStart + idx / 60);
    });

    // exit
    tl.to(["#ag-window", "#ag-tag"], { opacity: 0, duration: 0.2, ease: "power2.in" }, 5.45);
    window.__timelines["agent"] = tl;
  </script>
