<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0d10;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #backdrop {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 1300px 900px at 50% 45%, #171a20 0%, #0b0d10 75%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16"
      data-width="1920"
      data-height="1080"
    >
      <div id="backdrop"></div>
      <div
        id="agent"
        data-composition-id="agent"
        data-composition-src="compositions/agent.html"
        data-start="0"
        data-duration="5.7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="chat"
        data-composition-id="chat"
        data-composition-src="compositions/chat.html"
        data-start="5.7"
        data-duration="3.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="slab"
        data-composition-id="slab"
        data-composition-src="compositions/slab.html"
        data-start="9"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="explode"
        data-composition-id="explode"
        data-composition-src="compositions/explode.html"
        data-start="12"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
