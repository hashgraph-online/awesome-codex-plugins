version: 2
updates:
  # Keep GitHub Actions pinned versions current. Grouped into a single weekly PR
  # so a fleet-wide action bump is one review, not one per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
