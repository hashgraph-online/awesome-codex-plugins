version: 2
updates:
  # Every action is pinned to a commit SHA (issue #472); this is what proposes
  # the bump when an action publishes a new release, rewriting the trailing
  # `# v4`-style comment together with the SHA. Grouped into one PR so a
  # week's worth of pin bumps lands as a single review rather than a dozen.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # An action pin bump changes nothing a user of dex can see, so it needs no
    # changelog fragment. Setting `labels` replaces Dependabot's defaults, which
    # is why the first two are restated.
    labels:
      - "dependencies"
      - "github_actions"
      - "no-changelog"
    # A release is not taken on its first days: a broken one is usually yanked
    # or patched inside that window.
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"

  # The engine's Python dependencies (#795), read from packages/dex-core's
  # pyproject.toml and uv.lock. Weekly, and never a major: a major is a
  # migration (DuckDB 2.0 changed the relation API, #797) and gets its own
  # issue rather than an automatic pull request.
  #
  # Grouped by what has to move together rather than one PR per package. The
  # dbt stack is coupled through its adapters (dbt-databricks bounds dbt-core,
  # dbt-common, pydantic and the Databricks clients), so bumping one member
  # alone resolves to nothing or to an untested combination. Developer tools
  # are separate so a formatter bump never rides in with a runtime change.
  # Bounds dex holds deliberately (sqlglot <31, duckdb <3, the Snowflake
  # connector <5, MetricFlow's single minor) still bind: Dependabot proposes lock
  # updates inside them and a range change only when a ceiling is widened by hand.
  #
  # Every PR here is `no-changelog`: exmergo-dex-core is a library, so users
  # resolve from pyproject.toml's ranges, never from uv.lock, and a lock-only
  # bump changes what CI runs and nothing a user installs. A bump that moves a
  # user-facing pin (motley-slayer, below) gets its fragment when it is migrated.
  # Without the label every PR here failed the changelog check until a
  # maintainer added it by hand.
  - package-ecosystem: "uv"
    directory: "/packages/dex-core"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "no-changelog"
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # motley-slayer is one exact release, held equal to SLAYER_VERSION by a
      # test, so its PR fails CI on purpose: it is the weekly notice that a
      # migration is due (format version, goldens, schema_drift entry points),
      # never a routine merge. It used to be ignored outright, and the pin fell
      # six minors behind in a month (1.2.0 to 1.8.2) before anyone noticed.
      # First, because a dependency joins the first group that matches it.
      slayer:
        patterns:
          - "motley-slayer"
      dev-tools:
        patterns:
          - "ruff"
          - "towncrier"
          - "pytest"
      dbt-stack:
        patterns:
          - "dbt-*"
          - "metricflow*"
          - "mashumaro"
          - "pydantic*"
          - "databricks-*"
      runtime:
        patterns:
          - "*"
