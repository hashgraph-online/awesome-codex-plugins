interface:
  display_name: "Suede AI Lead Magnet Skills"
  short_description: "Decide what to give away for an email"
  default_prompt: "Use $suede-lead-magnets on [target]. The user is planning gated content, a content upgrade, a template, or any downloadable in exchange for contact details. Work through format selection, depth, gating rules, delivery, and the sequence that follows the download, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
policy:
  allow_implicit_invocation: true
