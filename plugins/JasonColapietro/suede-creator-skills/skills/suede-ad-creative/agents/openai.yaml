interface:
  display_name: "Suede AI Ad Creative Skills"
  short_description: "Produce ad creative at volume"
  default_prompt: "Use $suede-ad-creative on [target]. The user needs ad copy variations, creative concepts, or a testing plan for a paid campaign. Work through headline and primary-text variants, platform specs, static and motion concepts, and a creative testing cadence, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
policy:
  allow_implicit_invocation: true
