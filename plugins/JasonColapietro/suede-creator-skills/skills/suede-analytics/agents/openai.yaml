interface:
  display_name: "Suede AI Analytics Skills"
  short_description: "Know whether any of it worked"
  default_prompt: "Use $suede-analytics on [target]. The user is setting up or fixing analytics, conversion tracking, or attribution, or cannot tell whether a change moved anything. Work through tracking plans, event and conversion instrumentation, UTM discipline, attribution, and auditing what is actually firing, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
