interface:
  display_name: "Suede AI Sales Enablement Skills"
  short_description: "Evidence-backed decks, battle cards, and playbooks"
  default_prompt: "Use $suede-sales-enablement on [target]. The user needs sales collateral, a demo script, objection handling, or materials for a sales conversation. Work through pitch decks, one-pagers, objection handling, demo scripts, battle cards, and deal-level ROI framing, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
policy:
  allow_implicit_invocation: true
