interface:
  display_name: "Suede AI SMS Skills"
  short_description: "Suede consent-aware SMS and MMS programs"
  default_prompt: "Use $suede-sms on [target]. The user is adding SMS or text-message marketing, or writing messages for an existing SMS list. Work through consent and compliance, message design, timing, cadence limits, and when SMS beats email, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
