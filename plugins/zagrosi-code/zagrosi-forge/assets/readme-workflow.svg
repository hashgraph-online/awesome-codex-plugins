<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
  <title id="title">Project, Plan, Implement</title>
  <desc id="desc">Start at the phase you need. Project splits a brief into project-manifest.md and child spec.md files. Plan creates sections/index.md and reviewed section contracts, with a shared plan when needed. Implement produces code, tests, and section records. Lean, standard, and deep use the same flow.</desc>
  <rect width="1000" height="350" fill="#F3F8F7"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#0B1F1E">
    <text x="40" y="51" font-size="25" font-weight="600">Start at the phase you need.</text>
    <g font-size="30" font-weight="700" fill="#0F766E">
      <text x="40" y="115">Project</text>
      <text x="366" y="115">Plan</text>
      <text x="700" y="115">Implement</text>
    </g>
    <g font-size="19">
      <text x="40" y="151">Split a broad brief.</text>
      <text x="366" y="151">Review behavior and tests.</text>
      <text x="700" y="151">Build, test, and record.</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <text x="40" y="206">project-manifest.md</text>
      <text x="40" y="237">*/spec.md</text>
      <text x="366" y="206">sections/index.md</text>
      <text x="366" y="237">section-*.md</text>
    </g>
    <g font-size="20">
      <text x="700" y="206">Code + tests</text>
      <text x="700" y="237">Section records</text>
    </g>
    <g font-size="16" fill="#355E57">
      <text x="40" y="264">Boundaries + dependencies</text>
      <text x="366" y="264">Shared plan when needed</text>
      <text x="700" y="264">Verified, resumable progress</text>
    </g>
    <text x="40" y="325" font-size="18" fill="#355E57">Lean · standard · deep — the same flow, with your chosen depth of investigation.</text>
  </g>
  <g fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M281 105h44m-9-8 9 8-9 8M614 105h44m-9-8 9 8-9 8"/>
  </g>
  <path d="M40 291h920" stroke="#B6CEC8"/>
</svg>
