[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "hermes-tweet"
version = "0.1.16"
description = "Hermes Agent plugin for Twitter search, monitoring, follower exports & approved X actions. Not affiliated with X Corp."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Xquik" }]
dependencies = [
  "httpx>=0.28.1,<0.29",
]
keywords = [
  "agent-skill",
  "agent-tools",
  "ai-agent",
  "automation",
  "hermes-agent",
  "hermes-plugin",
  "social-media",
  "tweet",
  "twitter",
  "twitter-api",
  "twitter-automation",
  "x",
  "x-api",
  "x-automation",
  "x-twitter",
  "xquik",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Plugins",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
  "bandit[toml]>=1.9.4",
  "basedpyright>=1.39.10",
  "build>=1.5.0",
  "pip-audit>=2.10.1",
  "PyYAML>=6.0.3",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.3",
  "twine>=7.0.0",
  "types-PyYAML>=6.0.12.20260815",
  "mypy==2.4.0",
]

[project.urls]
Homepage = "https://github.com/Xquik-dev/hermes-tweet#readme"
Documentation = "https://github.com/Xquik-dev/hermes-tweet#readme"
Repository = "https://github.com/Xquik-dev/hermes-tweet"
Issues = "https://github.com/Xquik-dev/hermes-tweet/issues"
ClawHub = "https://clawhub.ai/xquik/hermes-tweet"
DeepWiki = "https://deepwiki.com/Xquik-dev/hermes-tweet"
piwheels = "https://piwheels.org/project/hermes-tweet/"
"Xquik Platform" = "https://xquik.com"

[project.entry-points."hermes_agent.plugins"]
hermes-tweet = "hermes_tweet"

[tool.hatch.build.targets.wheel]
packages = ["hermes_tweet"]

[tool.hatch.build.targets.sdist]
include = [
  "/.claude-plugin",
  "/.codex-plugin",
  "/assets",
  "/bin",
  "/dashboard",
  "/hermes_tweet",
  "/scripts",
  "/tests",
  "/.codexignore",
  "/.hermes-eco.json",
  "/CHANGELOG.md",
  "/LICENSE",
  "/MANIFEST.in",
  "/README.md",
  "/SECURITY.md",
  "/after-install.md",
  "/plugin.yaml",
  "/pyproject.toml",
  "/skill.json",
  "/uv.lock",
]

[tool.ruff]
line-length = 100
src = ["hermes_tweet", "scripts", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "BLE001",
  "COM812",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D203",
  "D213",
  "ISC001",
  "N999",
  "TRY300",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D105", "D107", "EM101", "PLR2004", "S101", "TRY003"]
"scripts/**/*.py" = ["T201"]
# Script tests start this repository's own scripts with fixed arguments.
"tests/test_*_command.py" = ["S603"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Name the precise type. Any switches type checking off."
"typing.cast".msg = "Narrow the value with isinstance or a typed parser. cast skips the check."
"typing_extensions.Any".msg = "Name the precise type. Any switches type checking off."
"typing_extensions.cast".msg = "Narrow the value with isinstance or a typed parser. cast skips the check."

[tool.ruff.lint.isort]
known-first-party = ["hermes_tweet"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)SPDX-FileCopyrightText: 2026 Xquik Contributors"

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false

[tool.mypy]
files = ["."]
explicit_package_bases = true
python_version = "3.11"
strict = true
strict_bytes = true
strict_equality_for_none = true
warn_unreachable = true
disallow_any_expr = true
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_unimported = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
  "unused-ignore",
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]

[tool.coverage.run]
source = ["hermes_tweet", "tests"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
