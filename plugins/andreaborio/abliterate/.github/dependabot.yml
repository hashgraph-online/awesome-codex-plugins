version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /engine
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # The engine is bundled for Node 18+ and tested on Node 22: major bumps of
    # type packages and the compiler are done by hand, together with bin/abliterate.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      engine-dev:
        patterns: ["*"]
