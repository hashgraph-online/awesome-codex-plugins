  #     models:
  #       - cursor-agent:auto
  #       - gemini:gemini-3.8-flash
  #     quick:
  #       - cursor-agent:auto
  #   code-review:
  #     models:
  #       - cursor-agent:gpt-5.6-sol-xhigh
