# Cloudflare Pages 项目：tutti.pics（静态 public/ + functions/ + D1 内测名单）
name = "tutti-site"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "tutti-waitlist"
database_id = "00000000-0000-0000-0000-000000000000" # 部署前：wrangler d1 create tutti-waitlist，把真 id 填这里
