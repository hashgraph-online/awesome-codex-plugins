version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule: { interval: 'weekly' }
  - package-ecosystem: 'npm'
    directory: '/'
    schedule: { interval: 'weekly' }
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
    ignore:
      # Remove once @docusaurus/theme-mermaid allows @mermaid-js/layout-elk 1.x as a peer (#2890).
      - dependency-name: '@mermaid-js/layout-elk'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'pip'
    directory: '/'
    schedule: { interval: 'weekly' }
