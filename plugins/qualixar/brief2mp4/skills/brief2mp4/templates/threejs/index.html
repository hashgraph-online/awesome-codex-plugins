<!doctype html>
<!--
  brief2mp4 starter: a Three.js scene that HyperFrames can render frame by frame.
  The whole picture is a pure function of time t (seconds). GSAP owns the clock;
  Three.js only draws. Replace the scene, keep the pattern.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Local copies, so the render never touches the network: run scripts/vendor_libs.sh <project> --three first. -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #14112b;
        --ink: #fff4e8;
        --accent: #ff7a59;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #stage { position: absolute; inset: 0; }
      #gl { width: 1920px; height: 1080px; display: block; }
      #title {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 140px;
        text-align: center;
        color: var(--ink);
        font: 700 120px/1 "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.12em;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <canvas id="gl" class="clip" width="1920" height="1080" data-start="0" data-duration="10"></canvas>
      <div id="title" class="clip" data-start="0" data-duration="10">TITLE</div>
    </div>

    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
    <script type="module">
      import * as THREE from "three";

      const DURATION = 10;

      // Renderer: fixed size, pixel ratio 1, keep the buffer so each captured frame is complete.
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.setClearColor(0x14112b, 1);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(40, 1920 / 1080, 0.1, 200);

      scene.add(new THREE.HemisphereLight(0xfff4e8, 0x14112b, 0.6));
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(5, 6, 4);
      scene.add(key);

      // Placeholder subject: replace with the scene the brief asks for.
      const subject = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.4, 1),
        new THREE.MeshStandardMaterial({ color: 0xff7a59, flatShading: true, roughness: 0.55 })
      );
      scene.add(subject);

      // Seeded random (never Math.random): same seed, same picture, every render.
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(42);
      const stars = new THREE.BufferGeometry();
      const pts = new Float32Array(900 * 3);
      for (let i = 0; i < pts.length; i++) pts[i] = (rand() - 0.5) * 80;
      stars.setAttribute("position", new THREE.BufferAttribute(pts, 3));
      scene.add(new THREE.Points(stars, new THREE.PointsMaterial({ color: 0xfff4e8, size: 0.08 })));

      const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);

      // The only place that decides what the frame looks like.
      function draw(t) {
        const dolly = ease(t / DURATION);
        camera.position.set(Math.sin(t * 0.25) * 2, 1.2 - dolly * 0.6, 9 - dolly * 3.5);
        camera.lookAt(0, -0.7, 0);
        subject.rotation.set(t * 0.3, t * 0.5, 0);
        renderer.render(scene, camera);
      }

      // GSAP owns time. HyperFrames seeks this timeline to every frame.
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 7);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      draw(0);
      tl.seek(0);
    </script>
  </body>
</html>
