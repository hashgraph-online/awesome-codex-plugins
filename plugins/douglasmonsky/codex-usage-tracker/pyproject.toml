[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage-tracking"
version = "0.28.0"
description = "Fast, exact, local-first Codex usage facts and evidence."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Douglas Monsky" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["codex", "tokens", "usage", "local-first"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
codex-usage-tracker = "codex_usage_tracker.kernel.interfaces.cli.main:main"

[project.urls]
Homepage = "https://github.com/douglasmonsky/codex-usage-tracker"
Repository = "https://github.com/douglasmonsky/codex-usage-tracker"
Issues = "https://github.com/douglasmonsky/codex-usage-tracker/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "mypy>=1.10",
  "psutil==7.2.2",
  "pytest>=8.0",
  "pyright>=1.1.405",
  "ruff>=0.8",
  "scalene==2.3.0",
  "tomli>=2.0; python_version < '3.11'",
  "types-jsonschema>=4.23",
  "xenon>=0.9.3",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "codex_usage_tracker.agent_kernel*",
  "codex_usage_tracker.kernel*",
  "codex_usage_tracker.release*",
]
namespaces = true

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[tool.setuptools.package-data]
"codex_usage_tracker.agent_kernel.storage" = ["*.sql"]
"codex_usage_tracker.kernel.interfaces" = ["schemas/*.json"]
"codex_usage_tracker.kernel.interfaces.http" = [
  "console_assets/*.css",
  "console_assets/*.html",
  "console_assets/*.js",
  "console_assets/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests/agent_kernel", "tests/experiments", "tests/kernel", "tests/release"]
pythonpath = [".", "src"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM300"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
mypy_path = ["src", "experiments/physical-architecture"]
explicit_package_bases = true
files = [
  "experiments/physical-architecture/qualification.py",
  "experiments/physical-architecture/run_bakeoff.py",
  "experiments/physical-architecture/shared",
  "experiments/physical-architecture/candidate_a",
  "experiments/physical-architecture/candidate_c",
  "experiments/physical-architecture/candidate_d",
  "scripts/aggregate_performance_qualification.py",
  "scripts/performance_budget_contract.py",
  "scripts/run_performance_suite.py",
  "scripts/benchmark_agent_outcome.py",
  "scripts/benchmark_kernel.py",
  "scripts/check_agent_kernel_contracts.py",
  "scripts/check_kernel_maintainability.py",
  "scripts/check_kernel_release_candidate.py",
  "scripts/check_kernel_scope.py",
  "scripts/generate_kernel_interfaces.py",
  "scripts/generate_kernel_manifests.py",
  "scripts/release_promotion_quality.py",
  "scripts/smoke_installed_console.py",
  "scripts/smoke_installed_catalog.py",
  "scripts/smoke_installed_package.py",
  "src/codex_usage_tracker/release/artifact_manifest.py",
  "src/codex_usage_tracker/agent_kernel",
  "src/codex_usage_tracker/kernel",
  "tests/agent_kernel/contracts/reference",
  "tests/agent_kernel/fixtures",
]

[tool.pyright]
include = [
  "experiments/physical-architecture/qualification.py",
  "experiments/physical-architecture/run_bakeoff.py",
  "experiments/physical-architecture/shared",
  "experiments/physical-architecture/candidate_a",
  "experiments/physical-architecture/candidate_c",
  "experiments/physical-architecture/candidate_d",
  "scripts/aggregate_performance_qualification.py",
  "scripts/performance_budget_contract.py",
  "scripts/run_performance_suite.py",
  "scripts/benchmark_agent_outcome.py",
  "scripts/benchmark_kernel.py",
  "scripts/check_agent_kernel_contracts.py",
  "scripts/check_kernel_maintainability.py",
  "scripts/check_kernel_release_candidate.py",
  "scripts/check_kernel_scope.py",
  "scripts/generate_kernel_interfaces.py",
  "scripts/generate_kernel_manifests.py",
  "scripts/smoke_installed_console.py",
  "scripts/smoke_installed_catalog.py",
  "src/codex_usage_tracker/agent_kernel",
  "src/codex_usage_tracker/kernel",
  "tests/agent_kernel/contracts/reference",
  "tests/agent_kernel/fixtures",
  "tests/agent_kernel/storage",
]
extraPaths = ["src", "experiments/physical-architecture"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
