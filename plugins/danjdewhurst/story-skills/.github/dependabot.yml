version: 2
updates:
  # "/" covers .github/workflows/. Dependabot's github-actions ecosystem reads
  # /.github/workflows under each directory it is given, so it never reads
  # templates/github/, which holds no .github/workflows of its own. Those
  # templates get no bump pull requests here: a bump of an action they use
  # needs the same SHA in templates/github/ by hand, and the pin check in
  # test/check-scripts.test.js fails until they match. Grouping by dependency
  # name puts one action's bump in a single pull request.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        group-by: dependency-name
        patterns:
          - "*"
  # The documentation website's build tools (site/package.json). Nothing
  # here ships in the npm package or runs in the CLI. One pull request a
  # week holds every bump, since VitePress and the Mermaid plugin move
  # together. A version must be a week old before it is proposed, so a
  # compromised release is usually caught first.
  - package-ecosystem: "npm"
    directories:
      - "/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docs-site:
        patterns:
          - "*"
