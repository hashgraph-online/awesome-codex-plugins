version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
    # Dependabot only edits the .in files; the uv-compiled locks the runtime installs
    # from must be regenerated by hand (tests/test_mcp_packaging.py fails otherwise).
    ignore:
      # mcp 2.x is a rewrite, not a bump: FastMCP becomes MCPServer and the protocol
      # types move to snake_case. It has to be a deliberate migration, never a merge.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
