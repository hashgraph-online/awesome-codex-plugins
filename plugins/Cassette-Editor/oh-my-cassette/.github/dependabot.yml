version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # A new major of the MCP SDK changes the server and protocol APIs the bridge is built on, so
      # it is a deliberate migration, never a merge.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The base image of the Glama inspection build, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
