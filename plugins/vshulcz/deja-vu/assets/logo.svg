<svg xmlns="http://www.w3.org/2000/svg" width="620" height="170" viewBox="0 0 620 170" role="img" aria-label="deja-vu">
  <!-- Generated by scripts/genlogo from internal/mark. Do not hand-edit: the
     sprite is the source, and the terminal banner draws from the same grid.
     Coat, accent and features are the three colours xterm-256 holds exactly,
     so vector and terminal agree. -->
  <style>
    .t1, .t2, .eyes-half, .eyes-shut, .ear-flick { opacity: 0 }
    /* Everything that deforms turns about the point between the front paws, so
       the cat is pressed into the ground rather than moved around above it. */
    .hop, .breathe { transform-origin: 108px 151px }
    @media (prefers-reduced-motion: no-preference) {
      /* The one continuous motion on the mark. Everything else cuts between
         poses; this eases, and a creature that is never perfectly still is the
         difference between an animal and a diagram. */
      .breathe { animation: dv-breathe 4.9s cubic-bezier(.4,0,.5,1) infinite }
      .hop     { animation: dv-hop 18.7s cubic-bezier(.4,0,.45,1) infinite }
      .paw-l   { animation: dv-paw-l 18.7s cubic-bezier(.4,0,.45,1) infinite }
      .paw-r   { animation: dv-paw-r 18.7s cubic-bezier(.4,0,.45,1) infinite }
      .t0  { animation: dv-t0 4.7s steps(1, end) infinite }
      .t1  { animation: dv-t1 4.7s steps(1, end) infinite }
      .t2  { animation: dv-t2 4.7s steps(1, end) infinite }
      .eyes-open { animation: dv-open 7.3s steps(1, end) infinite }
      .eyes-half { animation: dv-half 7.3s steps(1, end) infinite }
      .eyes-shut { animation: dv-shut 7.3s steps(1, end) infinite }
      .eyes { animation: dv-glance 9.7s cubic-bezier(.4,0,.5,1) infinite }
      .ear-up    { animation: dv-ear-up 11.3s steps(1, end) infinite }
      .ear-flick { animation: dv-ear 11.3s steps(1, end) infinite }
    }
    /* Draw in, hold at the top a moment, let it out. Taller is narrower: a body
       that gains height without losing width is inflating, not breathing. The
       pause at the top is what separates a breath from a pendulum. */
    @keyframes dv-breathe { 0% { transform: scale(1, 1) } 40%, 56% { transform: scale(.978, 1.026) } 100% { transform: scale(1, 1) } }
    /* Once every eighteen seconds it hops. Gathers itself, springs, comes down,
       takes the landing in the legs, rocks to a stop.
       Leaving the ground is only allowed because of what surrounds it: a squash
       to push off from and a squash to land in. That is the whole difference
       between a jump and a hover, and an earlier version of this mark hovered
       because it had the rise without either.
       Stretched going up and squashed at both ends, volume held throughout — a
       shape that keeps its width through a jump reads as a lift, not a leap. */
    @keyframes dv-hop {
      0%, 86%  { transform: translateY(0) scale(1, 1) }
      88%      { transform: translateY(0) scale(1.07, .93) }
      89.9%    { transform: translateY(-4px) scale(.93, 1.09) }
      91.4%    { transform: translateY(-9px) scale(.97, 1.035) }
      92.7%    { transform: translateY(-4px) scale(.95, 1.06) }
      94%      { transform: translateY(0) scale(1.075, .925) }
      95.8%    { transform: translateY(0) scale(.98, 1.022) }
      97.4%, 100% { transform: translateY(0) scale(1, 1) }
    }
    /* The paws, on the hop's own clock. They tuck under the animal while it is
       off the ground and spread as it takes the landing, which is what a cat
       does and what stops the jump reading as the whole shape being lifted.
       A cell either way is the only travel there is, and it is enough because
       the haunches cover both ends of it — see TestTheHaunchesCoverThePaws. */
    @keyframes dv-paw-l { 0%, 88% { transform: translateX(0) } 89.9%, 92.7% { transform: translateX(6px) } 94%, 95.4% { transform: translateX(-6px) } 97.4%, 100% { transform: translateX(0) } }
    @keyframes dv-paw-r { 0%, 88% { transform: translateX(0) } 89.9%, 92.7% { transform: translateX(-6px) } 94%, 95.4% { transform: translateX(6px) } 97.4%, 100% { transform: translateX(0) } }
    /* The tail rests for four fifths of its cycle, then sweeps out and back. */
    @keyframes dv-t0 { 0%, 79.9% { opacity: 1 } 80%, 96.9% { opacity: 0 } 97%, 100% { opacity: 1 } }
    @keyframes dv-t1 { 0%, 79.9% { opacity: 0 } 80%, 84.9% { opacity: 1 } 85%, 91.9% { opacity: 0 } 92%, 96.9% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @keyframes dv-t2 { 0%, 84.9% { opacity: 0 } 85%, 91.9% { opacity: 1 } 92%, 100% { opacity: 0 } }
    /* One blink a cycle, down through the half-lid and back up: about a tenth
       of a second on each lid position and a sixth shut. Two blinks half a
       second apart, which is what this was, reads as a flutter. */
    @keyframes dv-open { 0%, 89.9% { opacity: 1 } 90%, 95.7% { opacity: 0 } 95.8%, 100% { opacity: 1 } }
    @keyframes dv-half { 0%, 89.9% { opacity: 0 } 90%, 91.6% { opacity: 1 } 91.7%, 94.1% { opacity: 0 } 94.2%, 95.7% { opacity: 1 } 95.8%, 100% { opacity: 0 } }
    @keyframes dv-shut { 0%, 91.6% { opacity: 0 } 91.7%, 94.1% { opacity: 1 } 94.2%, 100% { opacity: 0 } }
    /* Looks aside, holds it a moment, looks back. */
    @keyframes dv-glance { 0%, 70% { transform: translateX(0) } 74%, 84% { transform: translateX(6px) } 88%, 100% { transform: translateX(0) } }
    @keyframes dv-ear { 0%, 96.9% { opacity: 0 } 97%, 99.4% { opacity: 1 } 99.5%, 100% { opacity: 0 } }
    @keyframes dv-ear-up { 0%, 96.9% { opacity: 1 } 97%, 99.4% { opacity: 0 } 99.5%, 100% { opacity: 1 } }
  </style>
