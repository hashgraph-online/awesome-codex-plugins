[project]
name = "legends-seo-dungeon"
version = "2.2.5"
description = "Open-source Legends SEO Dungeon skill suite"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
  { name = "Avalon Reset", email = "avalonreset@users.noreply.github.com" },
]
keywords = [
  "codex",
  "seo",
  "technical-seo",
  "schema",
  "schema-markup",
  "core-web-vitals",
  "google-search-console",
  "dataforseo",
  "ai-search",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.urls]
Homepage = "https://seodungeon.com"
Repository = "https://github.com/avalonreset/legends-seo-dungeon"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
