<!-- Slot booking (private chat, production). Source: build with scripts/build_widget.py.
  chat_data: {"svc":"service name","dur":minutes,"pr":price in minor units,"cur":"EUR","d0":unix of the first day 00:00 UTC,
              "m":[7 hex strings, one per day: bit i set = slot i is free; slot i starts at 09:00 + 30 min * i, 18 slots],
              "sel":"<day>:<HHMM>" chosen, not yet confirmed (or ""),"bk":"<day>:<HHMM>" booked (or ""),"r":N}
  Requests: "pick:<day>:<HHMM>@rev" (the slot may be taken meanwhile), "book" (confirm sel), "cancel" (cancel the booking).
  The day strip is local UI: all seven days are already in the state. -->
<style>
/*@kit tokens.css*/
.ds { display: flex; gap: 4px; margin: 8px 0 }
.ds .ch { flex: 1; min-width: 0; padding: 3px 0; min-height: 44px; line-height: 1.25; text-align: center; font-size: .87em }
.ds[hidden], .gd[hidden] { display: none }
.ds b { display: block; font-weight: 600 }
.gd { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px }
.gd .ch { padding: 6px 0; border-radius: var(--k-r) }
.tk { color: var(--k-hint); text-decoration: line-through }
.ds .tk { text-decoration: none }
.bs { margin: 8px 0 } .bs b { display: block; font-size: 1.07em }
.ft { margin-top: 8px } .ft button { width: 100%; min-height: 36px }
</style>
<div class="k">
  <div class="hd"><span class="tt el" id="ti"></span><span class="tt" id="pr"></span></div>
  <div class="mt" id="du"></div>
  <div class="ds" id="ds"></div>
  <div class="gd" id="gd"></div>
  <div class="sf bs" id="bs"></div>
  <div class="ft" id="ft"></div>
  <div class="st" id="st"></div>
</div>
<!--@kit runtime.js-->
<!--@kit i18n.js-->
<script>
/*@lang en*/K.add({ en: { min: "min", conf: "Confirm", bk: "Booked", canc: "Cancel booking", full: "No free slots this week. Check back later.",
        tk: "That slot is taken", none: "No service yet. The bot will fill this in." } });/*@end*/
/*@lang ru*/K.add({ ru: { min: "мин", conf: "Подтвердить", bk: "Записано", canc: "Отменить запись", full: "На этой неделе мест нет. Загляните позже.",
        tk: "Это время занято", none: "Услуги пока нет. Бот её пришлёт." } });/*@end*/
/*@lang uk*/K.add({ uk: { min: "хв", conf: "Підтвердити", bk: "Записано", canc: "Скасувати запис", full: "На цьому тижні місць немає. Загляньте пізніше.",
        tk: "Цей час зайнято", none: "Послуги поки немає. Бот її надішле." } });/*@end*/
var dy = -1;
function p2(n) { return (n < 10 ? "0" : "") + n; }
function hm(i, c) { var n = 540 + 30 * i; return p2(n / 60 | 0) + (c ? ":" : "") + p2(n % 60); }
function draw() {
  var s = K.S.chatData, $ = K.$, dis = K.busy || !K.can(), d, i;
  ["ds", "gd", "bs", "ft"].forEach(function (x) { $(x).innerHTML = ""; });
  $("bs").hidden = 1;
  if (!s) { $("ti").textContent = K.t("none"); $("pr").textContent = $("du").textContent = ""; return; }
  var day = function (n, o) { o.timeZone = "UTC"; return K.time(s.d0 + n * 86400, o); };
  var free = function (n, j) { return parseInt(s.m[n], 16) >> j & 1; };
  var any = s.m.map(function (x) { return parseInt(x, 16) > 0; });
  $("ti").textContent = s.svc;
  $("pr").textContent = K.money(s.pr, s.cur);
  $("du").textContent = K.nf(s.dur) + " " + K.t("min");
  var at = s.bk || s.sel;
  if (dy < 0) dy = at ? +at.split(":")[0] : Math.max(0, any.indexOf(true));
  if (s.bk) {
    var a = s.bk.split(":");
    var b = $("bs"); b.hidden = 0;
    b.appendChild(K.h("span", "mt", K.t("bk")));
    b.appendChild(K.h("b", "", day(+a[0], { weekday: "long", day: "numeric", month: "long" }) + ", " + a[1].slice(0, 2) + ":" + a[1].slice(2)));
    var c = K.h("button", "", K.t("canc")); c.disabled = dis;
    c.onclick = function () { K.ask("cancel"); };
    $("ft").appendChild(c);
    $("ds").hidden = $("gd").hidden = 1;
    return;
  }
  $("ds").hidden = $("gd").hidden = 0;
  for (d = 0; d < 7; d++) (function (d) {
    var n = new Date((s.d0 + d * 86400) * 1000).getUTCDate();
    var e = K.h("button", "ch" + (d == dy ? " on" : any[d] ? "" : " tk"));
    e.appendChild(K.h("span", "", day(d, { weekday: "narrow" })));
    e.appendChild(K.h("b", "", n));
    e.onclick = function () { dy = d; draw(); };
    $("ds").appendChild(e);
  })(d);
  if (!any.some(Boolean)) { $("gd").appendChild(K.h("div", "mt", K.t("full"))); $("gd").style.display = "block"; return; }
  $("gd").style.display = "";
  for (i = 0; i < 18; i++) (function (i) {
    var f = free(dy, i), on = s.sel == dy + ":" + hm(i);
    var e = K.h("button", "ch" + (on ? " on" : f ? "" : " tk"), hm(i, 1));
    e.disabled = f && dis;
    e.onclick = function () { if (f) K.ask("pick:" + dy + ":" + hm(i) + "@" + K.R.chatData); else K.st(K.t("tk"), "e"); };
    $("gd").appendChild(e);
  })(i);
  var g = K.h("button", "", K.t("conf") + (s.sel ? " · " + day(+s.sel.split(":")[0], { weekday: "short", day: "numeric", month: "short" }) + ", " + s.sel.split(":")[1].slice(0, 2) + ":" + s.sel.split(":")[1].slice(2) : ""));
  g.disabled = dis || !s.sel;
  g.onclick = function () { K.ask("book"); };
  $("ft").appendChild(g);
}
K.start(draw);
</script>
