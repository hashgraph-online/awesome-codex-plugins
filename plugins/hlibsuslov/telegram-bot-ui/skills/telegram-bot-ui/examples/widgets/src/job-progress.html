<!-- Job progress (private chat). Source: build with scripts/build_widget.py.
  chat_data: {"ti":title,"st":"queued|running|done|failed","sg":stage 0..4 (queued, fetching, transforming, uploading, done),
              "p":processed,"n":total,"t0":start unix,"at":unix when eta was computed,"eta":seconds left,
              "end":finish unix (done/failed),"err":error line,"url":https file link,"r":N}
  Requests: "sync" (background poll), "cancel", "retry". The elapsed timer is derived from t0 every second, never counted. -->
<style>
/*@kit tokens.css*/
.pg { margin: 8px 0 }
.pg .rw { justify-content: space-between; margin-top: 4px }
.sg { margin: 8px 0 }
.sg > div { display: flex; gap: 8px; padding: 3px 0; color: var(--k-hint) }
.sg b { width: 1.2em; flex: none; text-align: center; font-weight: 400 }
.sg .dn2 { color: var(--k-ok) } .sg .cur { color: var(--k-tx); font-weight: 600 } .sg .bad { color: var(--k-bad); font-weight: 600 }
.er { color: var(--k-bad); font-size: .93em; margin-top: 6px }
</style>
<div class="k">
  <div class="hd"><span class="tt el" id="ti"></span><span class="mt" id="pc"></span></div>
  <div class="pg"><div class="br"><i id="pb"></i></div>
    <div class="rw mt"><span id="pn"></span><span id="eta"></span></div></div>
  <div class="sg sf" id="sg"></div>
  <div class="rw mt"><span id="el"></span></div>
  <div class="er" id="er"></div>
  <button class="wd" id="bt"></button>
  <div class="st" id="st"></div>
</div>
<!--@kit runtime.js-->
<!--@kit i18n.js-->
<script>
/*@lang en*/K.add({ en: { g0: "Queued", g1: "Fetching", g2: "Transforming", g3: "Uploading", g4: "Done", el: "Elapsed", eta: "ETA", can: "Cancel", sure: "Tap again to cancel", open: "Open file", retry: "Retry", none: "No job yet. The bot will start one.", fin: "Finished in" } });/*@end*/
/*@lang ru*/K.add({ ru: { g0: "В очереди", g1: "Загрузка данных", g2: "Обработка", g3: "Отправка", g4: "Готово", el: "Прошло", eta: "Осталось", can: "Отмена", sure: "Нажмите ещё раз для отмены", open: "Открыть файл", retry: "Повторить", none: "Задачи пока нет. Бот её запустит.", fin: "Заняло" } });/*@end*/
/*@lang uk*/K.add({ uk: { g0: "У черзі", g1: "Завантаження даних", g2: "Обробка", g3: "Надсилання", g4: "Готово", el: "Минуло", eta: "Залишилось", can: "Скасувати", sure: "Натисніть ще раз для скасування", open: "Відкрити файл", retry: "Повторити", none: "Завдання поки немає. Бот його запустить.", fin: "Тривало" } });/*@end*/
var armed = 0;
function mmss(x) {
  x = Math.max(0, Math.floor(x));
  var s = x % 60;
  return Math.floor(x / 60) + ":" + (s < 10 ? "0" : "") + s;
}
function live() {
  var s = K.S.chatData, $ = K.$;
  if (!s) return;
  var now = Date.now() / 1000, run = s.st == "running" || s.st == "queued";
  $("el").textContent = (s.st == "done" ? K.t("fin") : K.t("el")) + " " + mmss((run ? now : s.end) - s.t0);
  $("eta").textContent = s.st == "running" ? K.t("eta") + " " + mmss(s.eta - (now - s.at)) : "";
}
function draw() {
  var s = K.S.chatData, $ = K.$, off = K.busy || !K.can(), b = $("bt");
  if (!s) { $("ti").textContent = K.t("none"); b.style.display = "none"; return; }
  $("ti").textContent = s.ti;
  var pct = s.n ? Math.round(s.p / s.n * 100) : 0, fail = s.st == "failed";
  $("pc").textContent = pct + "%";
  $("pb").style.width = pct + "%";
  $("pb").style.background = fail ? "var(--k-bad)" : s.st == "done" ? "var(--k-ok)" : "";
  $("pn").textContent = K.nf(s.p) + " / " + K.nf(s.n);
  var sg = $("sg"); sg.innerHTML = "";
  for (var i = 0; i < 5; i++) {
    var cur = i == s.sg, past = i < s.sg || s.st == "done";
    var d = K.h("div", past ? "dn2" : cur ? (fail ? "bad" : "cur") : "");
    d.appendChild(K.h("b", "", past ? "✓" : cur ? (fail ? "✕" : "●") : "○"));
    d.appendChild(K.h("span", "", K.t("g" + i)));
    sg.appendChild(d);
  }
  $("er").textContent = fail ? s.err : "";
  live();
  b.style.display = "";
  if (s.st == "done") {
    b.textContent = K.t("open");
    b.disabled = !window.TelegramWidget;
    b.onclick = function () { if (window.TelegramWidget && s.url) window.TelegramWidget.openLink(s.url); };
    return;
  }
  b.disabled = off;
  if (fail) {
    b.textContent = K.t("retry");
    b.onclick = function () { K.ask("retry"); };
    return;
  }
  b.textContent = K.t(armed ? "sure" : "can");
  b.onclick = function () {
    if (!armed) { armed = 1; setTimeout(function () { armed = 0; draw(); }, 3000); draw(); return; }
    armed = 0;
    K.ask("cancel");
  };
}
setInterval(live, 1000);
K.start(draw, { sync: "sync" });
</script>
