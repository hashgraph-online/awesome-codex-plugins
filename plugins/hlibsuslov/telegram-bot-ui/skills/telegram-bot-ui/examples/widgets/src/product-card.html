<!-- Product card (private chat, production). Source: build with scripts/build_widget.py.
  chat_data: {"n":"name","rt":rating*10,"rv":reviews,"pr":price in minor units,"cur":"EUR","c":[colour names],"z":[size names],
              "k":[stock per variant, index = colour * sizes + size],"ct":units already in the cart,"r":N}
  Requests: "add:<variant>:<qty>" (variant = index into k; the bot checks the stock and answers the new state).
  Colour, size and quantity are local UI until Add to cart. Names come localized from the bot. -->
<style>
/*@kit tokens.css*/
.im { height: 92px; display: flex; justify-content: center; align-items: center }
.im svg { height: 100%; width: 100%; max-width: 200px }
.i1 { fill: currentColor } .i2 { fill: var(--k-tx) } .i3 { fill: var(--k-bg) } .i4 { fill: var(--k-sep) }
.fw { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.tk { color: var(--k-hint); text-decoration: line-through }
.qt { display: flex; align-items: center; margin-top: 8px; gap: 8px }
.qt .ch { min-width: 34px; padding: 6px 0; text-align: center }
.qt b { min-width: 1.4em; text-align: center; font-weight: 600 }
.qt button:last-child { flex: 1; min-height: var(--tg-button-height, 36px) }
.lo { color: var(--k-warn) } .no { color: var(--k-bad) } .in { color: var(--k-ok) }
</style>
<div class="k">
  <div class="sf im" id="im"></div>
  <div class="hd" style="margin-top:8px"><span class="tt el" id="ti"></span><span class="tt" id="pr"></span></div>
  <div class="mt" id="rt"></div>
  <div class="fw" id="cc"></div>
  <div class="fw" id="zz"></div>
  <div class="mt" id="sk" style="margin-top:6px"></div>
  <div class="qt" id="qt"></div>
  <div class="st" id="st"></div>
</div>
<!--@kit runtime.js-->
<!--@kit i18n.js-->
<script>
/*@lang en*/K.add({ en: { rv: "reviews", add: "Add to cart", sold: "Sold out", left: "Only # left", ins: "In stock", ct: "In cart",
        done: "Added to cart", none: "No product yet. The bot will fill this in." } });/*@end*/
/*@lang ru*/K.add({ ru: { rv: "отзывов", add: "В корзину", sold: "Нет в наличии", left: "Осталось # шт.", ins: "В наличии", ct: "В корзине",
        done: "Добавлено в корзину", none: "Товара пока нет. Бот его пришлёт." } });/*@end*/
/*@lang uk*/K.add({ uk: { rv: "відгуків", add: "У кошик", sold: "Немає в наявності", left: "Залишилось # шт.", ins: "В наявності", ct: "У кошику",
        done: "Додано до кошика", none: "Товару поки немає. Бот його надішле." } });/*@end*/
var ci = -1, zi = 0, q = 1, TINT = ["var(--k-ok)", "var(--k-warn)", "var(--k-tx)"];
function draw() {
  var s = K.S.chatData, $ = K.$, dis = K.busy || !K.can(), i;
  ["cc", "zz", "qt", "im"].forEach(function (x) { $(x).innerHTML = ""; });
  if (!s) { $("ti").textContent = K.t("none"); $("pr").textContent = $("rt").textContent = $("sk").textContent = ""; return; }
  var nz = s.z.length, at = function (c, z) { return s.k[c * nz + z]; };
  var any = function (c) { return s.z.some(function (_, z) { return at(c, z) > 0; }); };
  if (ci < 0 || ci >= s.c.length) { ci = Math.max(0, s.c.findIndex(function (_, c) { return any(c); })); zi = 0; }
  if (at(ci, zi) < 1) zi = Math.max(0, s.z.findIndex(function (_, z) { return at(ci, z) > 0; }));
  var st = at(ci, zi);
  q = Math.max(1, Math.min(q, st, 9));
  $("im").style.color = TINT[ci % 3];
  $("im").innerHTML = '<svg viewBox="0 0 120 100" aria-hidden="true"><ellipse class="i4" cx="60" cy="92" rx="24" ry="4"/><rect class="i1" x="44" y="22" width="32" height="70" rx="10"/><rect class="i3" x="44" y="50" width="32" height="7"/><rect class="i2" x="50" y="8" width="20" height="14" rx="4"/><rect class="i3" x="51" y="30" width="4" height="14" rx="2"/></svg>';
  $("ti").textContent = s.n;
  $("pr").textContent = K.money(s.pr, s.cur);
  $("rt").textContent = "★ " + K.nf(s.rt / 10, { minimumFractionDigits: 1 }) + " · " + K.nf(s.rv) + " " + K.t("rv");
  s.c.forEach(function (n, c) {
    var b = K.h("button", "ch" + (c == ci ? " on" : any(c) ? "" : " tk"), n);
    b.disabled = dis || !any(c);
    b.onclick = function () { ci = c; draw(); };
    $("cc").appendChild(b);
  });
  s.z.forEach(function (n, z) {
    var b = K.h("button", "ch" + (z == zi ? " on" : at(ci, z) > 0 ? "" : " tk"), n);
    b.disabled = dis || at(ci, z) < 1;
    b.onclick = function () { zi = z; draw(); };
    $("zz").appendChild(b);
  });
  var sk = $("sk");
  sk.className = "mt " + (st < 1 ? "no" : st < 6 ? "lo" : "in");
  sk.textContent = st < 1 ? K.t("sold") : st < 6 ? K.t("left").replace("#", st) : K.t("ins");
  if (s.ct) sk.textContent = K.t("ct") + ": " + s.ct + " · " + sk.textContent;
  [["−", -1], ["+", 1]].forEach(function (a, j) {
    if (j) $("qt").appendChild(K.h("b", "", q));
    var b = K.h("button", "ch", a[0]);
    b.disabled = dis || st < 1 || q + a[1] < 1 || q + a[1] > Math.min(st, 9);
    b.onclick = function () { q += a[1]; draw(); };
    $("qt").appendChild(b);
  });
  var ad = K.h("button", "", st < 1 ? K.t("sold") : K.t("add"));
  ad.disabled = dis || st < 1;
  ad.onclick = function () { K.ask("add:" + (ci * nz + zi) + ":" + q, { done: K.t("done") }); };
  $("qt").appendChild(ad);
}
K.start(draw);
</script>
