<!-- Leaderboard with a poll (SHARED widget: public_data, send allow_queries + is_shared).
  public_data: {"ti":title,"top":[[name,score]...5],"n":total players,"poll":{"q":question,"o":[[label,count]x3],"cl":1 if closed},"r":N}
  Requests: "v:<0|1|2>" (vote; one per user, changing moves it; answer carries "my"). The own vote is kept in localStorage. -->
<style>
/*@kit tokens.css*/
.lb { margin: 8px 0 }
.lb .rw { padding: 6px 0; min-height: 22px }
.rk { width: 2.4em; flex: none; color: var(--k-hint); font-size: .87em }
.lb b { font-weight: 600 }
.pq { margin: 4px 0 6px; font-weight: 600; font-size: .93em }
.op { display: block; width: 100%; margin-top: 6px; border-radius: var(--k-r); background: var(--k-sec); color: var(--k-tx); border: 0; padding: 0; font: inherit; text-align: start; overflow: hidden; min-height: 36px }
.op .rw { padding: 8px 12px; position: relative }
.op i { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(128,128,128,.2) }
[dir=rtl] .op i { left: auto; right: 0 }
.op.on { color: var(--k-btn) } .op.on b { font-weight: 700 }
.op .rw > * { position: relative }
</style>
<div class="k">
  <div class="hd"><span class="tt el" id="ti"></span><span class="mt" id="pl"></span></div>
  <div class="lb ls" id="lb"></div>
  <div class="mt" id="em"></div>
  <div class="sf">
    <div class="pq" id="pq"></div>
    <div id="op"></div>
    <div class="mt" id="pm" style="margin-top:6px"></div>
  </div>
  <div class="st" id="st"></div>
</div>
<!--@kit runtime.js-->
<!--@kit i18n.js-->
<script>
/*@lang en*/K.add({ en: { pl: "players", poll: "Today's poll", vote: "Vote counted", cl: "Poll closed", votes: "votes", none: "No data yet. The bot will fill this in.", empty: "No players yet. Be the first on the board.", closed: "The poll is closed" } });/*@end*/
/*@lang ru*/K.add({ ru: { pl: "игроков", poll: "Опрос дня", vote: "Голос учтён", cl: "Опрос закрыт", votes: "голосов", none: "Данных пока нет. Бот их пришлёт.", empty: "Игроков пока нет. Станьте первым.", closed: "Опрос закрыт" } });/*@end*/
/*@lang uk*/K.add({ uk: { pl: "гравців", poll: "Опитування дня", vote: "Голос враховано", cl: "Опитування закрито", votes: "голосів", none: "Даних поки немає. Бот їх надішле.", empty: "Гравців поки немає. Станьте першим.", closed: "Опитування закрито" } });/*@end*/
var my = -1, KEY = "lb-my";
try { my = +localStorage.getItem(KEY); if (isNaN(my) || localStorage.getItem(KEY) == null) my = -1; } catch (e) {}
function draw() {
  var s = K.S.publicData, $ = K.$, medal = ["🥇", "🥈", "🥉"];
  if (!s) { $("ti").textContent = K.t("none"); return; }
  $("ti").textContent = s.ti;
  $("pl").textContent = s.n + " " + K.t("pl");
  var lb = $("lb"); lb.innerHTML = "";
  (s.top || []).forEach(function (e, i) {
    var r = K.h("div", "rw");
    r.appendChild(K.h("span", "rk", i < 3 ? medal[i] : "#" + (i + 1)));
    r.appendChild(K.h("span", "gr el", e[0]));
    r.appendChild(K.h("b", "", K.nf(e[1])));
    lb.appendChild(r);
  });
  $("em").textContent = (s.top || []).length ? "" : K.t("empty");
  var p = s.poll;
  $("pq").textContent = p.q;
  var tot = p.o.reduce(function (a, o) { return a + o[1]; }, 0), box = $("op");
  box.innerHTML = "";
  p.o.forEach(function (o, i) {
    var b = K.h("button", "op" + (my == i ? " on" : "")), r = K.h("div", "rw"), f = K.h("i");
    f.style.width = (tot ? Math.round(o[1] / tot * 100) : 0) + "%";
    b.appendChild(f);
    r.appendChild(K.h("span", "gr el", o[0]));
    r.appendChild(K.h(my == i ? "b" : "span", "", o[1]));
    b.appendChild(r);
    b.disabled = p.cl || K.busy || !K.can();
    b.onclick = function () {
      K.ask("v:" + i, { f: "publicData", done: K.t("vote"), then: function (a) {
        if (a.ok && typeof a.my == "number") { my = a.my; try { localStorage.setItem(KEY, my); } catch (e) {} }
      } });
    };
    box.appendChild(b);
  });
  $("pm").textContent = p.cl ? K.t("cl") : tot + " " + K.t("votes");
}
K.start(draw, { watch: true });
</script>
