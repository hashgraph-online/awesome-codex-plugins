<!-- Order tracker (private chat, production). Source: build with scripts/build_widget.py.
  chat_data: {"no":"#4821","s":0-4 current step (4 = delivered),"m":0 normal|1 delayed|2 cancelled,
              "t0".."t4": unix time each step was reached (absent when not reached),"eta":unix,"cr":"courier name","at":unix,"r":N}
  Requests: "sync" (background; the bot moves the step), "call" (ask the courier to call), "help" (open a support thread). -->
<style>
/*@kit tokens.css*/
.pl { font-size: .8em; padding: 2px 8px; border-radius: 999px; background: var(--k-sec); white-space: nowrap }
.s0 { color: var(--k-ok) } .s1 { color: var(--k-warn) } .s2 { color: var(--k-bad) }
.sp { display: flex; align-items: center; gap: 10px; min-height: 30px; color: var(--k-hint) }
.sp i { width: 12px; height: 12px; box-sizing: border-box; border: 2px solid currentColor; border-radius: 50%; flex: none }
.sp b { flex: 1; min-width: 0; font-weight: 400 }
.sp.d { color: var(--k-tx) } .sp.d i { background: var(--k-ok); border-color: var(--k-ok) }
.sp.c { color: var(--k-tx); font-weight: 600 } .sp.c b { font-weight: 600 }
.sp.c i { background: var(--k-btn); border-color: var(--k-btn); box-shadow: 0 0 0 3px var(--k-sec) }
.sp.c.w i { background: var(--k-warn); border-color: var(--k-warn) }
.sp.c.x i { background: var(--k-bad); border-color: var(--k-bad) }
.tl { margin: 8px 0 }
.cr { margin-bottom: 8px } .cr[hidden] { display: none }
.ac button { flex: 1; min-height: 36px }
</style>
<div class="k">
  <div class="hd"><span class="tt el" id="ti"></span><span class="pl" id="pl"></span></div>
  <div class="mt" id="eta"></div>
  <div class="tl" id="tl"></div>
  <div class="sf rw cr" id="cr"><span class="gr el" id="cn"></span><span class="mt" id="cl"></span></div>
  <div class="rw ac" id="ac"></div>
  <div class="st" id="st"></div>
</div>
<!--@kit runtime.js-->
<!--@kit i18n.js-->
<script>
/*@lang en*/K.add({ en: { p0: "Order placed", p1: "Cooking", p2: "Courier picked up", p3: "On the way", p4: "Delivered",
        late: "Delayed", canc: "Cancelled", eta: "Arrives about", eta2: "New arrival time about", cour: "Courier",
        call: "Call courier", help: "Help", none: "No order yet. The bot will fill this in." } });/*@end*/
/*@lang ru*/K.add({ ru: { p0: "Заказ принят", p1: "Готовится", p2: "Курьер забрал", p3: "В пути", p4: "Доставлен",
        late: "Задерживается", canc: "Отменён", eta: "Приедет около", eta2: "Новое время около", cour: "Курьер",
        call: "Позвонить курьеру", help: "Помощь", none: "Заказа пока нет. Бот его пришлёт." } });/*@end*/
/*@lang uk*/K.add({ uk: { p0: "Замовлення прийнято", p1: "Готується", p2: "Кур'єр забрав", p3: "В дорозі", p4: "Доставлено",
        late: "Затримується", canc: "Скасовано", eta: "Приїде близько", eta2: "Новий час близько", cour: "Кур'єр",
        call: "Зателефонувати кур'єру", help: "Допомога", none: "Замовлення поки немає. Бот його надішле." } });/*@end*/
function draw() {
  var s = K.S.chatData, $ = K.$;
  if (!s) { $("ti").textContent = K.t("none"); $("pl").textContent = ""; $("eta").textContent = ""; $("tl").innerHTML = ""; $("cr").hidden = 1; $("ac").innerHTML = ""; return; }
  var m = s.m | 0, live = m != 2 && s.s < 4, dis = K.busy || !K.can();
  $("ti").textContent = s.no;
  var k = m == 2 ? 2 : s.s > 3 ? 0 : m ? 1 : 0, pl = $("pl");
  pl.textContent = K.t(m == 2 ? "canc" : s.s > 3 ? "p4" : m ? "late" : "p" + s.s);
  pl.className = "pl s" + k;
  $("eta").textContent = live ? K.t(m ? "eta2" : "eta") + " " + K.time(s.eta) : s.t4 && m != 2 ? K.t("p4") + " " + K.time(s.t4) : "";
  var tl = $("tl"); tl.innerHTML = "";
  for (var i = 0; i < 5; i++) {
    var r = K.h("div", "sp" + (i < s.s || s.s > 3 ? " d" : i == s.s ? " c" + (m == 2 ? " x" : m ? " w" : "") : ""));
    r.appendChild(K.h("i"));
    r.appendChild(K.h("b", "el", K.t("p" + i)));
    r.appendChild(K.h("span", "mt", s["t" + i] ? K.time(s["t" + i]) : ""));
    tl.appendChild(r);
  }
  var cr = s.cr && live && s.s > 1;
  $("cr").hidden = !cr;
  if (cr) { $("cn").textContent = s.cr; $("cl").textContent = K.t("cour"); }
  var ac = $("ac"); ac.innerHTML = "";
  [["call", cr], ["help", 1]].forEach(function (a) {
    if (!a[1]) return;
    var b = K.h("button", "", K.t(a[0]));
    b.disabled = dis;
    b.onclick = function () { K.ask(a[0]); };
    ac.appendChild(b);
  });
}
K.start(draw, { sync: "sync" });
</script>
