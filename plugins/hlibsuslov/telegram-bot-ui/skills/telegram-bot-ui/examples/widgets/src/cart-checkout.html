<!-- Cart and checkout (private chat, production). Source: build with scripts/build_widget.py.
  chat_data: {"it":[[name,variant,qty,unit price in minor units]],"cur":"EUR","pc":["CODE",percent off] (optional),
              "dl":chosen delivery index,"dm":[[label,price in minor units]],"ph":0 editing|1 awaiting payment,"r":N}
  Requests: "q:<line>:<+1|-1>@rev" (stale verb: lines may have changed), "dl:<i>", "checkout".
  Totals are derived from the lines, the promo and the delivery option. Only four lines are drawn, the rest is "+N more". -->
<style>
/*@kit tokens.css*/
.pl { font-size: .8em; padding: 2px 8px; border-radius: 999px; background: var(--k-sec); white-space: nowrap; color: var(--k-warn) }
.ln { padding: 4px 0; min-height: 34px }
.ln .rw { justify-content: space-between }
.qs { display: flex; align-items: center; gap: 2px }
.qs .ch { min-width: 34px; padding: 4px 0; text-align: center }
.qs b { min-width: 1.4em; text-align: center; font-weight: 600 }
.pm { margin-top: 6px; color: var(--k-ok); font-size: .87em }
.tt2 { display: flex; justify-content: space-between; margin-top: 2px }
.tt2.tot { font-weight: 600; font-size: 1.07em; border-top: 1px solid var(--k-sep); padding-top: 4px; margin-top: 4px }
.tl { margin-top: 8px }
.dv { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.em { padding: 12px 0 }
</style>
<div class="k">
  <div class="hd"><span class="tt el" id="ti"></span><span class="pl" id="pl"></span></div>
  <div class="ls" id="ls"></div>
  <div class="mt" id="mo"></div>
  <div class="pm" id="pm"></div>
  <div class="tl" id="tl"></div>
  <div class="dv" id="dv"></div>
  <button class="wd" id="co"></button>
  <div class="st" id="st"></div>
</div>
<!--@kit runtime.js-->
<!--@kit i18n.js-->
<script>
/*@lang en*/K.add({ en: { cart: "Cart", sub: "Subtotal", dis: "Discount", del: "Delivery", tot: "Total", free: "Free", more: "more", co: "Checkout",
        wait2: "Awaiting payment", promo: "Promo", empty: "Your cart is empty.", none: "No cart yet. The bot will fill this in." } });/*@end*/
/*@lang ru*/K.add({ ru: { cart: "Корзина", sub: "Товары", dis: "Скидка", del: "Доставка", tot: "Итого", free: "Бесплатно", more: "ещё", co: "Оформить",
        wait2: "Ждём оплату", promo: "Промокод", empty: "Корзина пуста.", none: "Корзины пока нет. Бот её пришлёт." } });/*@end*/
/*@lang uk*/K.add({ uk: { cart: "Кошик", sub: "Товари", dis: "Знижка", del: "Доставка", tot: "Разом", free: "Безкоштовно", more: "ще", co: "Оформити",
        wait2: "Чекаємо оплату", promo: "Промокод", empty: "Кошик порожній.", none: "Кошика поки немає. Бот його надішле." } });/*@end*/
function draw() {
  var s = K.S.chatData, $ = K.$, dis = K.busy || !K.can();
  ["ls", "tl", "dv"].forEach(function (x) { $(x).innerHTML = ""; });
  $("pl").textContent = $("mo").textContent = $("pm").textContent = "";
  $("co").hidden = 1;
  if (!s) { $("ti").textContent = K.t("none"); return; }
  $("ti").textContent = K.t("cart");
  var it = s.it || [], m = function (v) { return K.money(v, s.cur); }, ph = s.ph == 1;
  if (!it.length) { $("ls").appendChild(K.h("div", "mt em", K.t("empty"))); return; }
  var sub = 0;
  it.forEach(function (x) { sub += x[2] * x[3]; });
  it.slice(0, 4).forEach(function (x, i) {
    var l = K.h("div", "ln"), a = K.h("div", "rw"), b = K.h("div", "rw");
    a.appendChild(K.h("span", "gr el", x[0]));
    a.appendChild(K.h("span", "", m(x[2] * x[3])));
    b.appendChild(K.h("span", "mt gr el", x[1]));
    var qs = K.h("div", "qs");
    [-1, 1].forEach(function (d, j) {
      if (j) qs.appendChild(K.h("b", "", x[2]));
      var c = K.h("button", "ch", d < 0 ? "−" : "+");
      c.disabled = dis || ph || x[2] + d > 9;
      c.onclick = function () { K.ask("q:" + i + ":" + (d < 0 ? "-1" : "+1") + "@" + K.R.chatData); };
      qs.appendChild(c);
    });
    b.appendChild(qs);
    l.appendChild(a); l.appendChild(b);
    $("ls").appendChild(l);
  });
  if (it.length > 4) $("mo").textContent = "+" + (it.length - 4) + " " + K.t("more");
  var pc = s.pc, off = pc ? Math.floor(sub * pc[1] / 100) : 0, dl = (s.dm || [])[s.dl] || ["", 0];
  if (pc) $("pm").textContent = K.t("promo") + " " + pc[0] + " −" + pc[1] + "%";
  [[K.t("sub"), m(sub)], off ? [K.t("dis"), "−" + m(off)] : 0, [K.t("del"), dl[1] ? m(dl[1]) : K.t("free")], [K.t("tot"), m(sub - off + dl[1])]].forEach(function (r, i, a) {
    if (!r) return;
    var d = K.h("div", "tt2" + (i == a.length - 1 ? " tot" : ""));
    d.appendChild(K.h("span", "", r[0])); d.appendChild(K.h("span", "", r[1]));
    $("tl").appendChild(d);
  });
  (s.dm || []).forEach(function (o, i) {
    var c = K.h("button", "ch" + (i == s.dl ? " on" : ""), o[0] + (o[1] ? " · " + m(o[1]) : ""));
    c.disabled = dis || ph;
    c.onclick = function () { if (i != s.dl) K.ask("dl:" + i); };
    $("dv").appendChild(c);
  });
  $("co").hidden = 0;
  $("co").textContent = ph ? K.t("wait2") : K.t("co") + " · " + m(sub - off + dl[1]);
  $("co").disabled = dis || ph;
  $("co").onclick = function () { K.ask("checkout"); };
  if (ph) $("pl").textContent = K.t("wait2");
}
K.start(draw);
</script>
