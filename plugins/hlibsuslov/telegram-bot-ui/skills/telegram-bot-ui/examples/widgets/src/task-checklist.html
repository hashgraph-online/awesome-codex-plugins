<!-- Task checklist (private chat). Source: build with scripts/build_widget.py.
  chat_data: {"ti":title,"t":[[id,title,status 0 To do|1 Doing|2 Done]...<=7],"r":N}
  Requests: "t:<id>@rev" (tap: cycles the status, stale verb). The widget shows the next status at once (pending)
  and rolls back if the request fails. -->
<style>
/*@kit tokens.css*/
.pr { margin: 8px 0 4px }
.tk { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 4px 0; background: none; border: 0; color: var(--k-tx); font: inherit; text-align: start }
.tk .ch { min-height: 26px; padding: 2px 10px; font-size: .8em; min-width: 4.6em; text-align: center; flex: none }
.tk .s1 { color: var(--k-warn) } .tk .s2 { color: var(--k-ok) }
.tk.p .ch { color: var(--k-hint) }
.tk.d .gr { text-decoration: line-through; color: var(--k-hint) }
</style>
<div class="k">
  <div class="hd"><span class="tt el" id="ti"></span><span class="mt" id="pc"></span></div>
  <div class="pr"><div class="br"><i id="pb"></i></div></div>
  <div class="ls" id="ls"></div>
  <div class="mt" id="em"></div>
  <div class="st" id="st"></div>
</div>
<!--@kit runtime.js-->
<!--@kit i18n.js-->
<script>
/*@lang en*/K.add({ en: { s0: "To do", s1: "Doing", s2: "Done", of: "of", dn: "done", ok: "Updated", none: "No data yet. The bot will fill this in.", empty: "No tasks yet. Add one in the chat.", all: "All done" } });/*@end*/
/*@lang ru*/K.add({ ru: { s0: "К работе", s1: "В работе", s2: "Готово", of: "из", dn: "готово", ok: "Обновлено", none: "Данных пока нет. Бот их пришлёт.", empty: "Задач пока нет. Добавьте в чате.", all: "Всё готово" } });/*@end*/
/*@lang uk*/K.add({ uk: { s0: "До роботи", s1: "У роботі", s2: "Готово", of: "з", dn: "готово", ok: "Оновлено", none: "Даних поки немає. Бот їх надішле.", empty: "Задач поки немає. Додайте в чаті.", all: "Усе готово" } });/*@end*/
var pend = {};
function draw() {
  var s = K.S.chatData, $ = K.$, off = K.busy || !K.can();
  if (!s) { $("ti").textContent = K.t("none"); return; }
  $("ti").textContent = s.ti;
  var ls = $("ls"), n = 0, done = 0, rev = "@" + K.R.chatData;
  ls.innerHTML = "";
  s.t.forEach(function (t) {
    var id = t[0], st = pend[id] != null ? pend[id] : t[2], p = pend[id] != null;
    n++; if (st == 2) done++;
    var b = K.h("button", "tk" + (p ? " p" : "") + (st == 2 ? " d" : ""));
    b.appendChild(K.h("span", "ch s" + st, K.t("s" + st) + (p ? "…" : "")));
    b.appendChild(K.h("span", "gr el", t[1]));
    b.disabled = off;
    b.onclick = function () {
      pend[id] = (t[2] + 1) % 3;
      var cl = function () { delete pend[id]; };
      if (!K.ask("t:" + id + rev, { done: K.t("ok"), then: cl, fail: cl })) cl();
    };
    ls.appendChild(b);
  });
  $("em").textContent = n ? "" : K.t("empty");
  $("pc").dir = "auto"; $("pc").textContent = n ? done + " " + K.t("of") + " " + n + " " + K.t("dn") : "";
  $("pb").style.width = n ? Math.round(done / n * 100) + "%" : "0";
  $("pb").style.background = n && done == n ? "var(--k-ok)" : "";
}
K.start(draw);
</script>
