<!-- Schedule calendar (private chat). Source: build with scripts/build_widget.py.
  chat_data: {"m":"YYYY-MM" month shown,"ev":[day numbers with events],"r":N}
  Requests: "m:<YYYY-MM>" (month arrows, edits state), "d:<YYYY-MM-DD>" (day tap: the ANSWER carries
  {"d":date,"ag":[[time,title]...]}, no state edit; the widget keeps the agenda locally). Agenda titles come localized. -->
<style>
/*@kit tokens.css*/
.hd { align-items: center }
.hd .tt { text-align: center }
.g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; margin: 6px 0 }
.g b { font-weight: 400; font-size: .8em; color: var(--k-hint) }
.dy { position: relative; min-height: 34px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--k-tx); font: inherit }
.dy.t { box-shadow: inset 0 0 0 1.5px var(--k-btn) }
.dy.on { background: var(--k-btn); color: var(--k-btx) }
.dy i { position: absolute; bottom: 3px; left: calc(50% - 2px); width: 4px; height: 4px; border-radius: 50%; background: var(--k-acc) }
.dy.on i { background: var(--k-btx) }
.ag .rw { padding: 6px 0; min-height: 34px }
.ag .tm { min-width: 3.4em; color: var(--k-hint) }
</style>
<div class="k">
  <div class="hd"><button class="ch" id="pv"></button><span class="tt el gr" id="ti"></span><button class="ch" id="nx"></button></div>
  <div class="g" id="g"></div>
  <div class="sf ag ls" id="ag"></div>
  <div class="st" id="st"></div>
</div>
<!--@kit runtime.js-->
<!--@kit i18n.js-->
<script>
/*@lang en*/K.add({ en: { pm: "Previous month", nm: "Next month", pick: "Tap a day to see its agenda", noev: "No events this month",
        free: "Nothing planned", none: "No schedule yet. The bot will send it." } });/*@end*/
/*@lang ru*/K.add({ ru: { pm: "Предыдущий месяц", nm: "Следующий месяц", pick: "Нажмите на день, чтобы увидеть планы", noev: "В этом месяце событий нет",
        free: "Ничего не запланировано", none: "Расписания пока нет. Бот его пришлёт." } });/*@end*/
/*@lang uk*/K.add({ uk: { pm: "Попередній місяць", nm: "Наступний місяць", pick: "Натисніть на день, щоб побачити плани", noev: "У цьому місяці подій немає",
        free: "Нічого не заплановано", none: "Розкладу поки немає. Бот його надішле." } });/*@end*/
var sel = "", ag = null, p = function (n) { return ("0" + n).slice(-2); };
function cell(d, i, e, t) {
  var b = K.h("button", "dy" + (d == t ? " t" : "") + (d == sel ? " on" : ""), i);
  if (e) b.appendChild(K.h("i"));
  b.onclick = function () {
    sel = d; ag = null;
    K.ask("d:" + d, { then: function (r) { ag = r.ag ? { d: r.d, l: r.ag } : null; } }) || draw();
  };
  return b;
}
function draw() {
  var s = K.S.chatData, $ = K.$, g = $("g"), a = $("ag"), n = new Date(), i, rtl = document.documentElement.dir == "rtl";
  g.innerHTML = a.innerHTML = "";
  $("pv").textContent = rtl ? "›" : "‹"; $("nx").textContent = rtl ? "‹" : "›";
  $("pv").setAttribute("aria-label", K.t("pm")); $("nx").setAttribute("aria-label", K.t("nm"));
  $("pv").disabled = $("nx").disabled = K.busy || !K.can() || !s;
  a.hidden = !s;
  if (!s) { $("ti").textContent = K.t("none"); return; }
  var y = +s.m.slice(0, 4), m = +s.m.slice(5), t = n.getFullYear() + "-" + p(n.getMonth() + 1) + "-" + p(n.getDate());
  $("ti").textContent = K.time(new Date(y, m - 1, 1) / 1000, { month: "long", year: "numeric" });
  $("pv").onclick = function () { K.ask("m:" + (m > 1 ? y + "-" + p(m - 1) : (y - 1) + "-12")); };
  $("nx").onclick = function () { K.ask("m:" + (m < 12 ? y + "-" + p(m + 1) : (y + 1) + "-01")); };
  for (i = 0; i < 7; i++) g.appendChild(K.h("b", "", K.time(new Date(2024, 0, 1 + i) / 1000, { weekday: "narrow" })));
  for (i = (new Date(y, m - 1, 1).getDay() + 6) % 7; i--;) g.appendChild(K.h("span"));
  for (i = 1; i <= new Date(y, m, 0).getDate(); i++) g.appendChild(cell(y + "-" + p(m) + "-" + p(i), i, s.ev.indexOf(i) >= 0, t));
  if (sel && ag && ag.d == sel) {
    a.appendChild(K.h("div", "mt", K.time(Date.parse(sel + "T12:00") / 1000, { weekday: "short", day: "numeric", month: "short" })));
    if (!ag.l.length) a.appendChild(K.h("div", "mt", K.t("free")));
    ag.l.forEach(function (x) {
      var r = K.h("div", "rw");
      r.appendChild(K.h("span", "tm", x[0]));
      r.appendChild(K.h("span", "gr el", x[1]));
      a.appendChild(r);
    });
  } else a.appendChild(K.h("div", "mt", s.ev.length ? K.t("pick") : K.t("noev")));
}
K.start(draw);
</script>
