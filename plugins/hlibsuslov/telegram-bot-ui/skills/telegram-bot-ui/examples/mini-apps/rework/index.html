<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>FitHub</title>
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <link rel="stylesheet" href="../_kit/tma.css">
  <script type="module" src="./dist/app.js"></script>
</head>
<body>
<!-- The gym-booking app from tests/fixtures/miniapp_rework/before, reworked on the kit in the native style:
     tab bar instead of the drawer, Telegram's BackButton and MainButton instead of the own header and fixed
     CTA, schedule rows instead of a 3-column grid, Stars amounts, payment through the server's invoice link
     and the server's order state. Fictional product. -->
<div class="tma-content-cap">
  <main class="tma-page" id="root"></main>
  <main class="tma-page tma-screen" id="detail" hidden></main>
</div>
<nav class="tma-tabbar tma-glass" role="tablist" aria-label="Sections" id="tabbar">
  <button type="button" role="tab" aria-selected="true" data-tab="classes"><svg class="tma-icon" aria-hidden="true"><use href="../_kit/icons.svg#i-calendar"/></svg>Classes</button>
  <button type="button" role="tab" aria-selected="false" data-tab="trainers"><svg class="tma-icon" aria-hidden="true"><use href="../_kit/icons.svg#i-people"/></svg>Trainers</button>
  <button type="button" role="tab" aria-selected="false" data-tab="membership"><svg class="tma-icon" aria-hidden="true"><use href="../_kit/icons.svg#i-card"/></svg>Membership</button>
  <button type="button" role="tab" aria-selected="false" data-tab="profile"><svg class="tma-icon" aria-hidden="true"><use href="../_kit/icons.svg#i-person"/></svg>Profile</button>
</nav>
<div class="tma-snackbar" role="status" id="snackbar" hidden></div>
<button type="button" class="tma-btn is-filled is-lg" data-tma-fallback="main-button" hidden></button>
</body>
</html>
