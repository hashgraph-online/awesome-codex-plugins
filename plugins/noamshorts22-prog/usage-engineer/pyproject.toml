[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-engineer"
dynamic = ["version"]
description = "Cut wasted work in Codex CLI and OpenCode sessions: usage audits, log compaction, context packs, stale-map checks and paired A/B benchmarks. Local only, no network."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Noam" }]
keywords = ["codex", "codex-cli", "opencode", "ai-agents", "tokens", "developer-tools", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = []

[project.scripts]
ue = "usage_engineer.ue:main"

[tool.setuptools]
packages = { find = { include = ["usage_engineer*"] } }
include-package-data = true

[tool.setuptools.package-data]
usage_engineer = ["profiles/**/*", "benchmarks/**/*"]

[tool.setuptools.dynamic]
version = { attr = "usage_engineer.ue.VERSION" }
