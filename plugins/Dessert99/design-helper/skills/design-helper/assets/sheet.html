<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 비교</title>
<!-- Project stylesheets (tokens.css, $WS/sheet.css) go here, before the sheet style. -->
<!-- dh:head -->
<style>
:root {
  --page:#f1f1f3; --surface:#ffffff; --line:#e7e7ea; --ink:#1f1f23; --sub:#63636b;
  --muted:#8b8b93; --accent:#3b5bdb; --accent-tint:rgba(59,91,219,.10); --radius:14px;
  --float:0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.06);
}
*, *::before, *::after { box-sizing:border-box }
body { margin:0; background:var(--page); color:var(--ink);
       font:13px/1.6 -apple-system, "Pretendard", "Apple SD Gothic Neo", sans-serif }
main { padding:8px 44px 64px }

.has-toc { display:flex; align-items:flex-start }
.has-toc > main { flex:1; min-width:0 }
.toc { flex:none; width:220px; position:sticky; top:0; height:100vh; overflow-y:auto;
       padding:28px 16px; background:var(--surface); border-right:1px solid var(--line);
       font-size:12px }
.toc-h { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.04em; margin:0 0 14px }
.toc-turn { font-weight:700; font-size:12.5px; margin:16px 0 4px }
.toc a { display:block; color:var(--sub); text-decoration:none; padding:4px 8px;
         margin-left:-8px; border-radius:6px }
.toc a.cur { background:var(--accent-tint); color:var(--accent); font-weight:600 }

.turn { display:flex; align-items:center; gap:16px; margin:72px 0 0;
        font-size:14px; font-weight:700; color:var(--ink) }
.turn::after { content:""; flex:1; height:2px; background:#d4d4d9; border-radius:1px }
main > .turn:first-child { margin-top:32px }

section h2 { font-size:20px; letter-spacing:-.01em; margin:22px 0 18px }
.desc { color:var(--sub); margin:0 0 16px; max-width:820px }

.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:36px 28px }
/* The frame stretches; the specimen inside stays at its true size, centered. */
.frame { display:flex; justify-content:center; background:var(--surface); border:1px solid rgba(0,0,0,.04);
         border-radius:var(--radius); box-shadow:var(--float); padding:18px 14px; overflow:hidden }
.cap { margin-top:12px; font-size:14px; line-height:1.7 }
.cap .n { display:flex; align-items:center; gap:8px; font-weight:700 }
.badge { display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 6px;
         border-radius:6px; background:var(--accent); color:#fff; font-size:12px; font-weight:700 }
.cost { margin-left:auto; font-size:11.5px; font-weight:500; padding:1px 8px;
        border-radius:99px; background:var(--page); color:#52525b }
.cap p { margin:6px 0 0 } .cap .resolved { margin-top:2px; font-size:13px; color:var(--muted) }
.gain { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:10px 0 0; color:var(--sub) }
.gain dt { color:var(--ink); font-weight:600 } .gain dd { margin:0 }
.bound { display:flex; gap:12px; max-width:820px; margin:18px 0 0; font-size:14px; line-height:1.7; color:var(--sub) }
.bound > b { color:var(--ink); white-space:nowrap }
/* Korean breaks between words, not inside them. */
.cap, .bound, .pick, section h2, .toc { word-break:keep-all; overflow-wrap:anywhere }
.pick { display:flex; gap:12px; max-width:820px; margin:14px 0 0; padding:12px 16px; font-size:14px; line-height:1.7;
        background:var(--surface); border:1px solid rgba(0,0,0,.04);
        border-radius:var(--radius); box-shadow:var(--float) }
.pick > b { color:var(--accent); white-space:nowrap }
/* 실물과 다름: a specimen that differs from what the code will do. */
.real { font-size:11.5px; font-weight:500; padding:0 7px; border-radius:99px;
        border:1px dashed #a1a1aa; color:#52525b }
.n > .real { margin-left:auto } .real + .cost { margin-left:8px }
/* A gray bracket beside the spot where the rungs differ, outside the specimen's pixels. */
.at { position:relative }
.look { position:absolute; pointer-events:none; border:0 solid var(--muted); border-radius:1px }
.look.x { bottom:-9px; height:0; border-bottom-width:2px }   /* set left and width */
.look.y { left:-9px; width:0; border-left-width:2px }        /* set top and height */
</style>
<style>
/* Specimen CSS goes here, after the sheet style. */
/* dh:style */
</style>
</head>
<body class="has-toc">
<nav class="toc">
  <div class="toc-h">목차</div>
  <!-- Turn labels and section links go here: <div class="toc-turn">요청 1 · ...</div> <a href="#r1-1">...</a> -->
  <!-- dh:toc -->
</nav>
<main>
  <!-- Turn dividers and sections go here, appended in order. -->
  <!-- dh:main -->
</main>

<!-- Section controls (references/controls.md) go here, before the scripts below. -->
<!-- dh:script -->

<script>
(() => {
  const links = [...document.querySelectorAll('.toc a')];
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    links.forEach(a => a.classList.toggle('cur', a.hash === '#' + e.target.id));
  }), { rootMargin: '0px 0px -70% 0px' });
  document.querySelectorAll('section[id]').forEach(s => io.observe(s));
})();
</script>
<script>
(() => {
  history.scrollRestoration = 'manual';   // place() decides where the reload lands
  const S = sessionStorage;
  const n = document.querySelectorAll('section').length;
  const prev = +S.getItem('n') || 0, y = +S.getItem('y') || 0;
  S.setItem('n', n);

  let touched = false;
  const place = () => {
    if (touched) return;
    if (n > prev) document.querySelectorAll('section')[n - 1]?.scrollIntoView();
    else scrollTo(0, y);
  };
  addEventListener('load', place);
  document.fonts?.ready.then(place);
  addEventListener('scroll', () => { touched = true; S.setItem('y', scrollY); }, { passive: true });

  // Compare against the copy this page was loaded from, not the first poll: an edit that
  // lands while the page is reloading is still caught. Last-Modified has 1s resolution, so
  // the length catches a second edit within the same second.
  const loaded = () => {
    const nav = performance.getEntriesByType('navigation')[0];
    return nav?.decodedBodySize ? Date.parse(document.lastModified) + ' ' + nav.decodedBodySize : null;
  };
  setInterval(async () => {
    const seen = loaded();   // the size is 0 until the response has been fully read
    if (!seen) return;
    const r = await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
    const t = Date.parse(r.headers.get('last-modified')) + ' ' + r.headers.get('content-length');
    if (t !== seen) location.reload();
  }, 1000);
})();
</script>
</body>
</html>
