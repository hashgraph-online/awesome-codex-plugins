name: Validate Codex Plugin Contributions

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SCANNER_GUIDE.md"
      - "scripts/check-alphabetical.py"
      - "scripts/validate-contribution.py"
      - "scripts/validate-contribution-centralized.py"
      - "scripts/test_validate_contribution_branch.py"
      - "scripts/publish-open-pr-checks.py"
      - "scripts/publish-open-pr-checks-centralized.py"
      - "scripts/test_publish_open_pr_checks.py"
      - "scripts/post-claim-notice.py"
      - "scripts/backfill-claim-notices.py"
      - "tests/test_post_claim_notice.py"
      - "tests/test_claim_notice_api_key.py"
      - "tests/test_backfill_claim_notices.py"
      - ".github/workflows/claim-notice.yml"
      - ".github/workflows/sweep-open-prs.yml"
      - ".github/workflows/validate-contribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check contribution requirements
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.entries.outputs.matrix }}
    steps:
      - name: Check out catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input "PyYAML==6.0.2"
      - name: Validate changed catalog entries
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest scripts/test_validate_contribution_branch.py
          python3 -m unittest scripts/test_publish_open_pr_checks.py
          python3 -m unittest scripts/test_check_alphabetical.py
          python3 -m unittest tests/test_post_claim_notice.py tests/test_backfill_claim_notices.py tests/test_claim_notice_api_key.py
          python3 scripts/check-alphabetical.py README.md --base-ref "$BASE_REF"
          python3 scripts/validate-contribution-centralized.py \
            --base-ref "$BASE_REF" \
            --matrix-output "$RUNNER_TEMP/contributions.json"
      - name: Export scanner matrix
        id: entries
        env:
          MATRIX_FILE: ${{ runner.temp }}/contributions.json
        run: |
          matrix="$(cat "$MATRIX_FILE")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.contribution.owner }}/${{ matrix.contribution.repo }}
    needs: validate
    if: needs.validate.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contribution: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - name: Check out contributed repository
        env:
          CONTRIBUTION_URL: https://github.com/${{ matrix.contribution.owner }}/${{ matrix.contribution.repo }}.git
          CONTRIBUTION_REF: ${{ matrix.contribution.ref || '' }}
        run: |
          if [[ -n "$CONTRIBUTION_REF" ]]; then
            git clone --depth 1 --branch "$CONTRIBUTION_REF" "$CONTRIBUTION_URL" "$RUNNER_TEMP/contributed"
          else
            git clone --depth 1 "$CONTRIBUTION_URL" "$RUNNER_TEMP/contributed"
          fi
      - name: Run HOL AI Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: ${{ runner.temp }}/contributed
          mode: scan
          min_score: 75
          fail_on_severity: none
          pr_comment: off
