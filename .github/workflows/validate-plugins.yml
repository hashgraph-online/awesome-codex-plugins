name: Sync marketplace artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - README.md
      - plugins.json
      - .agents/plugins/marketplace.json
      - plugins/**
      - scripts/generate_plugins_json.py
      - scripts/plugin_package.py
      - tests/test_generate_plugins_json.py
      - tests/test_portable_plugin_packages.py
  push:
    branches: [main]
    paths:
      - README.md
      - plugins.json
      - .agents/plugins/marketplace.json
      - plugins/**
      - scripts/generate_plugins_json.py
      - scripts/plugin_package.py
      - tests/test_generate_plugins_json.py
      - tests/test_portable_plugin_packages.py

permissions: {}

concurrency:
  group: marketplace-artifacts-${{ github.event_name != 'pull_request' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Sync marketplace artifacts with README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ github.token }}
          # Queued main jobs must include earlier merges and artifact commits.
          ref: ${{ github.event_name != 'pull_request' && 'main' || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test marketplace generator
        run: |
          python3 -m unittest discover -s tests -p 'test_generate_plugins_json.py' -v
          python3 -m unittest discover -s tests -p 'test_portable_plugin_packages.py' -v

  sync:
    name: Sync marketplace artifacts with README
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ github.token }}
          # Queued main jobs must include earlier merges and artifact commits.
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Regenerate and commit if changed
        run: |
          python3 scripts/generate_plugins_json.py
          if ! git diff --quiet -- plugins.json .agents/plugins/marketplace.json plugins; then
            echo "::notice::marketplace artifacts were out of sync"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "::notice::auto-committing synced artifacts"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add plugins.json .agents/plugins/marketplace.json plugins
              git commit -m "chore: sync marketplace artifacts with README"
              git push
            else
              echo "::notice::skipping push on ${{ github.event_name }} (detached HEAD on PR merge ref)"
            fi
          else
            echo "marketplace artifacts are up to date"
          fi
