name: Audit Codex Plugin Catalog

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit Community Plugins listings
    runs-on: ubuntu-24.04
    steps:
      - name: Check out catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Audit catalog entries
        run: |
          python3 scripts/audit-catalog.py \
            --output-json "$RUNNER_TEMP/catalog-audit.json" \
            --output-markdown "$RUNNER_TEMP/catalog-audit.md"
      - name: Publish audit summary
        if: always()
        run: cat "$RUNNER_TEMP/catalog-audit.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-catalog-audit-report
          path: |
            ${{ runner.temp }}/catalog-audit.json
            ${{ runner.temp }}/catalog-audit.md
          retention-days: 30
