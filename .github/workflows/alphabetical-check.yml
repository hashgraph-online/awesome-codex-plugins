name: Alphabetical Order Check

on:
  pull_request:
    paths:
      - "README.md"
      - "scripts/check-alphabetical.py"
      - "scripts/test_check_alphabetical.py"
      - ".github/workflows/alphabetical-check.yml"

permissions:
  contents: read

jobs:
  alphabetical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and check alphabetical changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          python3 -m unittest scripts/test_check_alphabetical.py
          python3 scripts/check-alphabetical.py README.md --base-ref "$BASE_REF"
