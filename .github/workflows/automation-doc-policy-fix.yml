name: Temporary scanner policy doc fix

on:
  push:
    branches:
      - automation/centralized-scanner-policy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/centralized-scanner-policy
      - name: Finish centralized scanner policy wording
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "README.md": [
                  (
                      "2. **Validate with [`plugin-scanner`](https://github.com/hashgraph-online/hol-guard)** — **Required: score ≥ 80, no high/critical findings**",
                      "2. **Validate with [`plugin-scanner`](https://github.com/hashgraph-online/hol-guard)**. The catalog-owned centralized scan must report a numeric score ≥ 80 before merge.",
                  ),
                  (
                      "| **Score**    | ≥ 80 / 130                                     |\n| **Severity** | No critical or high findings                   |\n| **CI**       | Scanner must run in your repo's GitHub Actions |",
                      "| **Centralized score** | ≥ 80 / 130 |\n| **Source CI** | Optional; recommended for pre-submission feedback |\n| **Action status** | Advisory when the numeric centralized score is available |",
                  ),
              ],
              "CONTRIBUTING.md": [
                  (
                      "You need a score of **80/130** or higher with **no critical or high severity findings**. Save the output to include in your PR description.",
                      "Use local scanner output to fix problems before submission. For catalog admission, the numeric score from the catalog-owned centralized scan is authoritative and must be at least **80/130**.",
                  ),
                  (
                      "- **Must pass the HOL Plugin Scanner** (score ≥ 80, no critical/high findings)",
                      "- **Must reach a centralized HOL Plugin Scanner score ≥ 80**",
                  ),
                  (
                      "- [ ] PR description includes your scanner score or CI link",
                      "- [ ] Optional: PR description includes a local or source-CI scanner score for context",
                  ),
              ],
              "SCANNER_GUIDE.md": [
                  (
                      "| **Source CI** | Optional; recommended for pre-submission feedback |",
                      "| **Source CI** | Optional; recommended for pre-submission feedback |\n\nCatalog admission uses the numeric score from the catalog-owned centralized scan. A score of **80/130 or higher** is scanner-clear even when the scanner action reports advisory findings or exits nonzero for a non-gating reason. Separate catalog-format, source-availability, or repository-integrity defects can still block merge.",
                  ),
              ],
          }

          for path_str, pairs in replacements.items():
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {path}: {old[:100]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
      - name: Commit policy documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CONTRIBUTING.md SCANNER_GUIDE.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: clarify centralized scanner threshold"
          git push origin HEAD:automation/centralized-scanner-policy
