name: Plugin Claim Notice

on:
  schedule:
    - cron: "23 * * * *"
  pull_request_target:
    types:
      - closed
    paths:
      - "README.md"
      - "plugins/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to post claim notice on"
        required: true
        type: string
      pr_title:
        description: "PR title"
        required: true
        type: string
      pr_author:
        description: "PR author login"
        required: true
        type: string

permissions:
  actions: write
  pull-requests: write
  issues: write
  contents: read

jobs:
  post-claim-notice:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Post claim instructions
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-claim-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure retry label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh label list --repo "$GITHUB_REPOSITORY" --search registry-claim-pending --json name --jq 'any(.[]; .name == "registry-claim-pending")')" != true ]; then
            gh label create registry-claim-pending --repo "$GITHUB_REPOSITORY" --color D4C5F9 --description "Claim notice awaits registry ingestion" --force
          fi

      - name: Post claim notice
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.inputs.pr_title || github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.inputs.pr_author || github.event.pull_request.user.login }}
          PENDING_RETRY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          REGISTRY_API: https://hol.org/registry/api/v1
        run: python3 scripts/post-claim-notice.py

      - name: Retry notices for recently merged plugins
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_API: https://hol.org/registry/api/v1
        run: python3 scripts/backfill-claim-notices.py
