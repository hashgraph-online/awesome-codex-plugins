name: Validate Plugin PR

on:
  pull_request:
    paths:
      - "plugins/**"
      - ".agents/plugins/marketplace.json"
      - "plugins.json"
      - "README.md"
      - "scripts/validate-plugin-pr.py"
      - "scripts/plugin_package.py"
      - "scripts/test_validate_plugin_pr.py"
      - "tests/test_remote_icon_validation.py"
      - "tests/test_validate_plugin_pr_branch.py"
      - "tests/test_portable_plugin_packages.py"

permissions:
  contents: read
  id-token: none

jobs:
  validate:
    name: Validate plugin bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test parser, branch history, and remote icons
        run: |
          python3 scripts/test_validate_plugin_pr.py
          python3 -m unittest discover -s tests -p 'test_remote_icon_validation.py' -v
          python3 -m unittest discover -s tests -p 'test_validate_plugin_pr_branch.py' -v
          python3 -m unittest discover -s tests -p 'test_portable_plugin_packages.py' -v
      - name: Validate changed plugin bundles
        run: python3 scripts/validate-plugin-pr.py --base-ref origin/${{ github.base_ref }}
